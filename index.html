<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة الشخصيات الافتراضية - استوديو التحريك</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Tahoma', sans-serif;
            background: #1a1a1a;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 { margin-bottom: 10px; font-size: 22px; color: #4CAF50; }
        
        /* شريط اختيار الشخصيات من المكتبة */
        .library-bar {
            background: #2a2a2a;
            padding: 15px 25px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            gap: 10px;
            align-items: center;
        }
        select {
            padding: 8px 15px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #333;
            color: #fff;
            cursor: pointer;
        }

        /* مساحة العمل لعرض الشخصية المركبة */
        .stage {
            width: 400px;
            height: 500px;
            background: #252525;
            border: 2px dashed #444;
            border-radius: 12px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        /* حاوية أجزاء الشخصية (الجذر المركزي) */
        .character-rig {
            position: relative;
            width: 0;
            height: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* خصائص أجزاء الشخصية المرتبطة بالعظام */
        .body-part {
            position: absolute;
            transform-origin: top center;
            user-select: none;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <h1>مكتبة الشخصيات الجاهزة</h1>
    
    <!-- قائمة اختيار الشخصية -->
    <div class="library-bar">
        <label for="characterSelect">اختر شخصية:</label>
        <select id="characterSelect">
            <option value="">جاري تحميل المكتبة...</option>
        </select>
    </div>

    <!-- مساحة المعاينة -->
    <div class="stage">
        <div class="character-rig" id="characterRig">
            <!-- سيتم تركيب أجزاء الشخصية هنا برمجياً -->
        </div>
    </div>

    <script>
        let charactersData = [];

        // 1. تحميل ملف المكتبة مع منع الكاش عبر Date.now()
        async function loadCharacterLibrary() {
            try {
                const response = await fetch('./list.json?t=' + Date.now());
                if (!response.ok) throw new Error('فشل في جلب ملف المكتبة list.json');
                
                charactersData = await response.json();
                populateDropdown();
                
                // تحميل أول شخصية افتراضياً إذا كانت متوفرة
                if (charactersData.length > 0) {
                    renderCharacter(charactersData[0]);
                }
            } catch (error) {
                console.error('خطأ:', error);
                document.getElementById('characterSelect').innerHTML = '<option>خطأ في تحميل المكتبة!</option>';
            }
        }

        // 2. تعبئة قائمة الاختيار بأسماء الشخصيات الموجودة في المكتبة
        function populateDropdown() {
            const select = document.getElementById('characterSelect');
            select.innerHTML = '';
            
            charactersData.forEach((char, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = char.name;
                select.appendChild(option);
            });
        }

        // 3. تركيب ورسم الشخصية المحددة وربط صورها بإحداثيات عظامها
        function renderCharacter(character) {
            const rigContainer = document.getElementById('characterRig');
            rigContainer.innerHTML = ''; // تفريغ الشخصية السابقة

            // المرور على كل جزء ووضعه في مكانه الصحيح
            for (const [partName, partInfo] of Object.entries(character.parts)) {
                const img = document.createElement('img');
                img.src = partInfo.src;
                img.className = 'body-part';
                img.style.zIndex = partInfo.zIndex || 1;
                
                // تطبيق الإحداثيات المضبوطة لكل جزء
                img.style.transform = `translate(${partInfo.x}px, ${partInfo.y}px)`;
                
                rigContainer.appendChild(img);
            }
        }

        // 4. الحدث عند تغيير الاختيار من القائمة المنسدلة
        document.getElementById('characterSelect').addEventListener('change', (e) => {
            const selectedIndex = e.target.value;
            if (charactersData[selectedIndex]) {
                renderCharacter(charactersData[selectedIndex]);
            }
        });

        // تشغيل التحميل عند فتح الصفحة
        loadCharacterLibrary();
    </script>

</body>
</html>
