<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twencraft Character Library Studio</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Tahoma', sans-serif;
            background: #141414;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .app-container {
            display: flex;
            gap: 20px;
            max-width: 1200px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }
        .sidebar {
            background: #1f1f1f;
            padding: 15px;
            border-radius: 10px;
            width: 410px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            max-height: 700px;
            overflow-y: auto;
            border: 1px solid #333;
        }
        .stage-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .top-bar {
            background: #1f1f1f;
            padding: 12px 20px;
            border-radius: 10px;
            width: 100%;
            display: flex;
            gap: 15px;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            border: 1px solid #333;
        }
        .control-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-size: 12px;
            color: #ffeb3b;
        }
        select, button, input[type="file"] {
            width: 100%;
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }
        button {
            background: #4CAF50;
            font-weight: bold;
            border: none;
            transition: background 0.2s;
        }
        button:hover { background: #45a049; }
        .stage {
            width: 460px;
            height: 560px;
            background: #1a1a1a;
            border: 2px dashed #444;
            border-radius: 12px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
        }
        .upload-slot {
            background: #252525;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            border: 1px solid #333;
        }
        .upload-slot label {
            display: block;
            font-weight: bold;
            color: #4CAF50;
            margin-bottom: 4px;
            font-size: 13px;
        }
        .sliders-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 8px;
        }
        .slider-field {
            display: flex;
            flex-direction: column;
            font-size: 11px;
            color: #bbb;
        }
        .slider-field span {
            display: flex;
            justify-content: space-between;
            color: #ffeb3b;
            margin-bottom: 2px;
        }
        .slider-field input[type="range"] {
            width: 100%;
            background: #333;
            height: 5px;
            border-radius: 3px;
            accent-color: #4CAF50;
        }
        .character-rig {
            position: relative;
            width: 0;
            height: 0;
        }
        .bone-node {
            position: absolute;
            width: 0;
            height: 0;
        }
        .body-part-img {
            position: absolute;
            user-select: none;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="sidebar">
            <div style="font-weight: bold; margin-bottom: 10px; color: #ffeb3b; font-size: 15px;">مكتبة الشخصيات والاستوديو</div>
            
            <div class="control-group" style="margin-bottom: 15px;">
                <label for="characterSelect" style="color: #ffeb3b; margin-bottom: 4px;">اختر الشخصية من المكتبة:</label>
                <select id="characterSelect"></select>
            </div>

            <div id="uploadSlotsContainer"></div>
        </div>

        <div class="stage-container">
            <div class="top-bar">
                <div class="control-group">
                    <label for="animSelect">مكتبة التحركات والوضعيات الجاهزة:</label>
                    <select id="animSelect">
                        <option value="idle">تنفس واستعداد هادئ (Organic Idle)</option>
                        <option value="walk">مشية احترافية مرنة (Fluid Walk)</option>
                        <option value="dance">رقصة حماسية متأرجحة (Dynamic Dance)</option>
                        <option value="combat">وضعية القتال والاستعداد (Combat Stance)</option>
                    </select>
                </div>
                <div style="width: 110px;">
                    <label style="opacity: 0;">تشغيل</label>
                    <button id="toggleBtn">إيقاف مؤقت</button>
                </div>
            </div>

            <div class="stage">
                <div class="character-rig" id="characterRig"></div>
            </div>
        </div>
    </div>

    <script>
        let characterLibrary = [];
        let activeCharacter = null;
        let boneAngles = {};
        let boneTargetAngles = {};
        let boneLags = { torso: 0.12, head: 0.15, r_arm: 0.09, l_arm: 0.09, r_leg: 0.1, l_leg: 0.1 };

        let animTime = 0;
        let isPlaying = true;
        let currentPose = 'idle';

        // تحميل ملف list.json الذي يحتوي على مكتبة الشخصيات
        async function loadCharacterLibrary() {
            try {
                const response = await fetch('list.json');
                characterLibrary = await response.json();
            } catch (e) {
                // بيانات افتراضية احتياطية في حال لم يتم العثور على الملف محلياً
                characterLibrary = [
                    {
                        id: "hero_mascot",
                        name: "الشخصية الأساسية (الافتراضية)",
                        parts: {
                            torso: { name: "الجذع الأساسي", src: "torso.png", width: 205, height: 145, x: 12, y: -19, zIndex: 2 },
                            head: { name: "الرأس", src: "head.png", width: 113, height: 124, x: 3, y: -48, zIndex: 3 },
                            r_arm: { name: "الذراع اليمنى", src: "right_arm.png", width: 165, height: 85, x: 21, y: -72, zIndex: 2 },
                            l_arm: { name: "الذراع اليسرى", src: "left_arm.png", width: 165, height: 85, x: -21, y: -72, zIndex: 2 },
                            r_leg: { name: "الرجل اليمنى", src: "right_leg.png", width: 166, height: 85, x: 21, y: 32, zIndex: 1 },
                            l_leg: { name: "الرجل اليسرى", src: "left_leg.png", width: 165, height: 85, x: -8, y: 32, zIndex: 1 }
                        }
                    }
                ];
            }
            initCharacterSelector();
        }

        function initCharacterSelector() {
            const select = document.getElementById('characterSelect');
            select.innerHTML = '';
            characterLibrary.forEach((char, index) => {
                const opt = document.createElement('option');
                opt.value = index;
                opt.textContent = char.name;
                select.appendChild(opt);
            });

            select.addEventListener('change', (e) => {
                loadCharacter(e.target.value);
            });

            loadCharacter(0);
        }

        function loadCharacter(index) {
            // نسخ عميق لبيانات الشخصية حتى لا تتأثر القيم الأصلية مباشرة بالتعديل الحر
            activeCharacter = JSON.parse(JSON.stringify(characterLibrary[index]));
            
            boneAngles = {};
            boneTargetAngles = {};
            for (let key in activeCharacter.parts) {
                boneAngles[key] = 0;
                boneTargetAngles[key] = 0;
            }

            buildUploadSlots();
            initRigDOM();
        }

        function buildUploadSlots() {
            const container = document.getElementById('uploadSlotsContainer');
            container.innerHTML = '';

            for (let [key, part] of Object.entries(activeCharacter.parts)) {
                const slot = document.createElement('div');
                slot.className = 'upload-slot';
                slot.innerHTML = `
                    <label>${part.name}</label>
                    <input type="file" accept="image/png, image/jpeg" data-bone="${key}" style="margin-bottom: 8px;">
                    <div class="sliders-grid">
                        <div class="slider-field">
                            <span>العرض: <b id="val_w_${key}">${part.width}px</b></span>
                            <input type="range" min="30" max="350" value="${part.width}" data-bone="${key}" data-prop="width">
                        </div>
                        <div class="slider-field">
                            <span>الارتفاع: <b id="val_h_${key}">${part.height}px</b></span>
                            <input type="range" min="30" max="350" value="${part.height}" data-bone="${key}" data-prop="height">
                        </div>
                        <div class="slider-field">
                            <span>موقع X: <b id="val_x_${key}">${part.x}</b></span>
                            <input type="range" min="-150" max="150" value="${part.x}" data-bone="${key}" data-prop="x">
                        </div>
                        <div class="slider-field">
                            <span>موقع Y: <b id="val_y_${key}">${part.y}</b></span>
                            <input type="range" min="-150" max="150" value="${part.y}" data-bone="${key}" data-prop="y">
                        </div>
                    </div>
                `;
                container.appendChild(slot);
            }

            container.querySelectorAll('input[type="file"]').forEach(input => {
                input.addEventListener('change', (e) => {
                    const boneKey = e.target.dataset.bone;
                    const file = e.target.files[0];
                    if (file) {
                        activeCharacter.parts[boneKey].src = URL.createObjectURL(file);
                        initRigDOM();
                    }
                });
            });

            container.querySelectorAll('input[type="range"]').forEach(slider => {
                slider.addEventListener('input', (e) => {
                    const boneKey = e.target.dataset.bone;
                    const prop = e.target.dataset.prop;
                    const val = parseInt(e.target.value);
                    
                    activeCharacter.parts[boneKey][prop] = val;
                    document.getElementById(`val_${prop === 'width' ? 'w' : prop === 'height' ? 'h' : prop}_${boneKey}`).textContent = val + (prop === 'width' || prop === 'height' ? 'px' : '');
                    
                    initRigDOM();
                });
            });
        }

        const poses = {
            idle: (t) => {
                if(boneTargetAngles.torso !== undefined) boneTargetAngles.torso = Math.sin(t * 0.04) * 0.03;
                if(boneTargetAngles.head !== undefined) boneTargetAngles.head = Math.sin(t * 0.04) * 0.08;
                if(boneTargetAngles.r_arm !== undefined) boneTargetAngles.r_arm = 0.1 + Math.sin(t * 0.04) * 0.1;
                if(boneTargetAngles.l_arm !== undefined) boneTargetAngles.l_arm = -0.1 - Math.sin(t * 0.04) * 0.1;
                if(boneTargetAngles.r_leg !== undefined) boneTargetAngles.r_leg = 0.05;
                if(boneTargetAngles.l_leg !== undefined) boneTargetAngles.l_leg = -0.05;
            },
            walk: (t) => {
                if(boneTargetAngles.torso !== undefined) boneTargetAngles.torso = Math.sin(t * 0.08) * 0.05;
                if(boneTargetAngles.head !== undefined) boneTargetAngles.head = Math.sin(t * 0.08) * 0.06;
                if(boneTargetAngles.r_arm !== undefined) boneTargetAngles.r_arm = Math.sin(t * 0.08) * 0.6;
                if(boneTargetAngles.l_arm !== undefined) boneTargetAngles.l_arm = -Math.sin(t * 0.08) * 0.6;
                if(boneTargetAngles.r_leg !== undefined) boneTargetAngles.r_leg = -Math.sin(t * 0.08) * 0.5;
                if(boneTargetAngles.l_leg !== undefined) boneTargetAngles.l_leg = Math.sin(t * 0.08) * 0.5;
            },
            dance: (t) => {
                if(boneTargetAngles.torso !== undefined) boneTargetAngles.torso = Math.sin(t * 0.15) * 0.15;
                if(boneTargetAngles.head !== undefined) boneTargetAngles.head = Math.cos(t * 0.15) * 0.2;
                if(boneTargetAngles.r_arm !== undefined) boneTargetAngles.r_arm = -1.5 + Math.sin(t * 0.15) * 0.8;
                if(boneTargetAngles.l_arm !== undefined) boneTargetAngles.l_arm = 1.5 + Math.cos(t * 0.15) * 0.8;
                if(boneTargetAngles.r_leg !== undefined) boneTargetAngles.r_leg = Math.sin(t * 0.15) * 0.4;
                if(boneTargetAngles.l_leg !== undefined) boneTargetAngles.l_leg = -Math.sin(t * 0.15) * 0.4;
            },
            combat: (t) => {
                if(boneTargetAngles.torso !== undefined) boneTargetAngles.torso = 0.1;
                if(boneTargetAngles.head !== undefined) boneTargetAngles.head = -0.1;
                if(boneTargetAngles.r_arm !== undefined) boneTargetAngles.r_arm = -0.8;
                if(boneTargetAngles.l_arm !== undefined) boneTargetAngles.l_arm = -1.2;
                if(boneTargetAngles.r_leg !== undefined) boneTargetAngles.r_leg = 0.2;
                if(boneTargetAngles.l_leg !== undefined) boneTargetAngles.l_leg = -0.2;
            }
        };

        function updatePhysics() {
            if (isPlaying) {
                animTime += 1;
                if (poses[currentPose]) {
                    poses[currentPose](animTime);
                }
            }

            for (let key in boneAngles) {
                if (boneTargetAngles[key] !== undefined) {
                    let diff = boneTargetAngles[key] - boneAngles[key];
                    boneAngles[key] += diff * (boneLags[key] || 0.1);
                }
            }
        }

        const rigContainer = document.getElementById('characterRig');

        function initRigDOM() {
            if (!activeCharacter) return;
            rigContainer.innerHTML = '';
            
            const torsoPart = activeCharacter.parts.torso;
            if (!torsoPart) return;

            const torsoDiv = document.createElement('div');
            torsoDiv.className = 'bone-node';
            torsoDiv.id = 'bone_torso';
            torsoDiv.style.zIndex = torsoPart.zIndex || 2;
            
            const torsoImg = document.createElement('img');
            torsoImg.src = torsoPart.src;
            torsoImg.className = 'body-part-img';
            torsoImg.style.width = torsoPart.width + 'px';
            torsoImg.style.height = torsoPart.height + 'px';
            torsoImg.style.left = `-${torsoPart.width / 2}px`;
            torsoImg.style.top = `-${torsoPart.height / 2}px`;
            torsoDiv.appendChild(torsoImg);

            // ربط باقي الأجزاء بالجذع كأبناء لضمان ثبات الحركة الهرمية المرنة
            ['head', 'r_arm', 'l_arm', 'r_leg', 'l_leg'].forEach(pName => {
                const part = activeCharacter.parts[pName];
                if (!part) return;

                const pDiv = document.createElement('div');
                pDiv.className = 'bone-node';
                pDiv.id = `bone_${pName}`;
                pDiv.style.zIndex = part.zIndex || 1;
                pDiv.style.transformOrigin = (pName === 'head') ? 'bottom center' : 'top center';
                
                const pImg = document.createElement('img');
                pImg.src = part.src;
                pImg.className = 'body-part-img';
                pImg.style.width = part.width + 'px';
                pImg.style.height = part.height + 'px';
                
                if (pDiv.style.transformOrigin === 'top center') {
                    pImg.style.left = `-${part.width / 2}px`;
                    pImg.style.top = '0px';
                } else {
                    pImg.style.left = `-${part.width / 2}px`;
                    pImg.style.bottom = '0px';
                }
                pDiv.appendChild(pImg);
                torsoDiv.appendChild(pDiv);
            });

            rigContainer.appendChild(torsoDiv);
        }

        function animationLoop() {
            updatePhysics();
            
            if (activeCharacter) {
                const torsoDiv = document.getElementById('bone_torso');
                if (torsoDiv) {
                    const torsoPart = activeCharacter.parts.torso;
                    let extraY = Math.sin(animTime * 0.08) * 3;
                    torsoDiv.style.transform = `translate(${torsoPart.x}px, ${torsoPart.y + extraY}px) rotate(${boneAngles.torso || 0}rad)`;
                    
                    ['head', 'r_arm', 'l_arm', 'r_leg', 'l_leg'].forEach((pName, idx) => {
                        const pDiv = torsoDiv.children[idx + 1];
                        const part = activeCharacter.parts[pName];
                        if (pDiv && part) {
                            pDiv.style.transform = `translate(${part.x}px, ${part.y}px) rotate(${boneAngles[pName] || 0}rad)`;
                        }
                    });
                }
            }

            requestAnimationFrame(animationLoop);
        }

        document.getElementById('animSelect').addEventListener('change', (e) => {
            currentPose = e.target.value;
            animTime = 0;
        });

        const toggleBtn = document.getElementById('toggleBtn');
        toggleBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            toggleBtn.textContent = isPlaying ? "إيقاف مؤقت" : "تشغيل";
            toggleBtn.style.background = isPlaying ? "#4CAF50" : "#ff9800";
        });

        loadCharacterLibrary();
        requestAnimationFrame(animationLoop);
    </script>
</body>
</html>
