<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twencraft Custom Studio - الهيكل العظمي بالقيم المخصصة</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Tahoma', sans-serif;
            background: #141414;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .app-container {
            display: flex;
            gap: 20px;
            max-width: 1200px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }
        .sidebar {
            background: #1f1f1f;
            padding: 15px;
            border-radius: 10px;
            width: 400px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            max-height: 680px;
            overflow-y: auto;
            border: 1px solid #333;
        }
        .stage-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .top-bar {
            background: #1f1f1f;
            padding: 12px 20px;
            border-radius: 10px;
            width: 100%;
            display: flex;
            gap: 15px;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            border: 1px solid #333;
        }
        .control-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-size: 12px;
            color: #ffeb3b;
        }
        select, button, input[type="file"] {
            width: 100%;
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }
        button {
            background: #4CAF50;
            font-weight: bold;
            border: none;
            transition: background 0.2s;
        }
        button:hover { background: #45a049; }
        .stage {
            width: 440px;
            height: 540px;
            background: #1a1a1a;
            border: 2px dashed #444;
            border-radius: 12px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
        }
        .upload-slot {
            background: #252525;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            border: 1px solid #333;
        }
        .upload-slot label {
            display: block;
            font-weight: bold;
            color: #4CAF50;
            margin-bottom: 4px;
            font-size: 13px;
        }
        .sliders-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 8px;
        }
        .slider-field {
            display: flex;
            flex-direction: column;
            font-size: 11px;
            color: #bbb;
        }
        .slider-field span {
            display: flex;
            justify-content: space-between;
            color: #ffeb3b;
            margin-bottom: 2px;
        }
        .slider-field input[type="range"] {
            width: 100%;
            background: #333;
            height: 5px;
            border-radius: 3px;
            accent-color: #4CAF50;
        }
        .character-rig {
            position: relative;
            width: 0;
            height: 0;
        }
        .bone-node {
            position: absolute;
            width: 0;
            height: 0;
        }
        .body-part-img {
            position: absolute;
            user-select: none;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="sidebar">
            <div style="font-weight: bold; margin-bottom: 10px; color: #ffeb3b; font-size: 15px;">لوحة تحكم وتعديل العظام بالقيم المسجلة</div>
            <div style="font-size: 12px; color: #ccc; margin-bottom: 15px; line-height: 1.5;">
                تم تسجيل القيم التي أرسلتها وضبطها كإعدادات افتراضية للمحرك. يمكنك التعديل عليها في أي وقت.
            </div>
            <div id="uploadSlotsContainer"></div>
        </div>

        <div class="stage-container">
            <div class="top-bar">
                <div class="control-group">
                    <label for="animSelect">مكتبة التحركات العضوية:</label>
                    <select id="animSelect">
                        <option value="idle">تنفس واستعداد هادئ (Organic Idle)</option>
                        <option value="walk">مشية احترافية مرنة (Fluid Walk)</option>
                        <option value="dance">رقصة حماسية متأرجحة (Dynamic Dance)</option>
                    </select>
                </div>
                <div style="width: 110px;">
                    <label style="opacity: 0;">تشغيل</label>
                    <button id="toggleBtn">إيقاف مؤقت</button>
                </div>
            </div>

            <div class="stage">
                <div class="character-rig" id="characterRig"></div>
            </div>
        </div>
    </div>

    <script>
        // إعدادات العظام مسجلة بالقيم الفعلية المستخرجة من لقطات الشاشة
        const bonesConfig = {
            torso: {
                name: "الجذع الأساسي (Torso)",
                width: 145, height: 205, x: 12, y: -19,
                origin: "center center", zIndex: 2,
                minW: 20, maxW: 300, minH: 20, maxH: 300, minX: -150, maxX: 150, minY: -200, maxY: 200,
                defaultImg: generatePlaceholderDataURL('torso.png', '#4CAF50', 145, 205),
                children: ['head', 'r_arm', 'l_arm', 'r_leg', 'l_leg']
            },
            head: {
                name: "الرأس (Head)",
                width: 124, height: 113, x: 3, y: -48,
                origin: "bottom center", zIndex: 3,
                minW: 20, maxW: 250, minH: 20, maxH: 250, minX: -150, maxX: 150, minY: -200, maxY: 50,
                defaultImg: generatePlaceholderDataURL('head.png', '#ffccbc', 124, 113),
                children: []
            },
            r_arm: {
                name: "الذراع اليمنى (Right Arm)",
                width: 85, height: 165, x: 21, y: -72,
                origin: "top center", zIndex: 2,
                minW: 10, maxW: 200, minH: 20, maxH: 300, minX: -100, maxX: 150, minY: -150, maxY: 150,
                defaultImg: generatePlaceholderDataURL('arm_right.png', '#66bb6a', 85, 165),
                children: []
            },
            l_arm: {
                name: "الذراع اليسرى (Left Arm)",
                width: 85, height: 165, x: -21, y: -72,
                origin: "top center", zIndex: 2,
                minW: 10, maxW: 200, minH: 20, maxH: 300, minX: -150, maxX: 100, minY: -150, maxY: 150,
                defaultImg: generatePlaceholderDataURL('arm_left.png', '#66bb6a', 85, 165),
                children: []
            },
            r_leg: {
                name: "الرجل اليمنى (Right Leg)",
                width: 85, height: 166, x: 0, y: 32,
                origin: "top center", zIndex: 1,
                minW: 10, maxW: 200, minH: 20, maxH: 300, minX: -100, maxX: 150, minY: -50, maxY: 200,
                defaultImg: generatePlaceholderDataURL('leg_right.png', '#388e3c', 85, 166),
                children: []
            },
            l_leg: {
                name: "الرجل اليسرى (Left Leg)",
                width: 85, height: 165, x: 32, y: -8,
                origin: "top center", zIndex: 1,
                minW: 10, maxW: 200, minH: 20, maxH: 300, minX: -100, maxX: 150, minY: -50, maxY: 200,
                defaultImg: generatePlaceholderDataURL('leg_left.png', '#388e3c', 85, 165),
                children: []
            }
        };

        let boneImages = {};
        for (let key in bonesConfig) {
            boneImages[key] = bonesConfig[key].defaultImg;
        }

        let boneAngles = { torso: 0, head: 0, r_arm: 0, l_arm: 0, r_leg: 0, l_leg: 0 };
        let boneTargetAngles = { torso: 0, head: 0, r_arm: 0, l_arm: 0, r_leg: 0, l_leg: 0 };
        let boneLags = { torso: 0.12, head: 0.15, r_arm: 0.09, l_arm: 0.09, r_leg: 0.1, l_leg: 0.1 };

        let animTime = 0;
        let isPlaying = true;
        let currentPose = 'idle';

        function generatePlaceholderDataURL(text, color, w, h) {
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = color;
            ctx.roundRect ? ctx.roundRect(0, 0, w, h, 8) : ctx.fillRect(0, 0, w, h);
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.fillStyle = '#111';
            ctx.font = 'bold 11px Tahoma';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, w / 2, h / 2);
            return canvas.toDataURL();
        }

        function buildUploadSlots() {
            const container = document.getElementById('uploadSlotsContainer');
            container.innerHTML = '';

            for (let [key, config] of Object.entries(bonesConfig)) {
                const slot = document.createElement('div');
                slot.className = 'upload-slot';
                slot.innerHTML = `
                    <label>${config.name}</label>
                    <input type="file" accept="image/png, image/jpeg" data-bone="${key}" style="margin-bottom: 8px;">
                    <div class="sliders-grid">
                        <div class="slider-field">
                            <span>العرض: <b id="val_w_${key}">${config.width}px</b></span>
                            <input type="range" min="${config.minW}" max="${config.maxW}" value="${config.width}" data-bone="${key}" data-prop="width">
                        </div>
                        <div class="slider-field">
                            <span>الارتفاع: <b id="val_h_${key}">${config.height}px</b></span>
                            <input type="range" min="${config.minH}" max="${config.maxH}" value="${config.height}" data-bone="${key}" data-prop="height">
                        </div>
                        <div class="slider-field">
                            <span>موقع X: <b id="val_x_${key}">${config.x}</b></span>
                            <input type="range" min="${config.minX}" max="${config.maxX}" value="${config.x}" data-bone="${key}" data-prop="x">
                        </div>
                        <div class="slider-field">
                            <span>موقع Y: <b id="val_y_${key}">${config.y}</b></span>
                            <input type="range" min="${config.minY}" max="${config.maxY}" value="${config.y}" data-bone="${key}" data-prop="y">
                        </div>
                    </div>
                `;
                container.appendChild(slot);
            }

            container.querySelectorAll('input[type="file"]').forEach(input => {
                input.addEventListener('change', (e) => {
                    const boneKey = e.target.dataset.bone;
                    const file = e.target.files[0];
                    if (file) {
                        const url = URL.createObjectURL(file);
                        boneImages[boneKey] = url;
                        initRigDOM();
                    }
                });
            });

            container.querySelectorAll('input[type="range"]').forEach(slider => {
                slider.addEventListener('input', (e) => {
                    const boneKey = e.target.dataset.bone;
                    const prop = e.target.dataset.prop;
                    const val = parseInt(e.target.value);
                    
                    bonesConfig[boneKey][prop] = val;
                    document.getElementById(`val_${prop === 'width' ? 'w' : prop === 'height' ? 'h' : prop}_${boneKey}`).textContent = val + (prop === 'width' || prop === 'height' ? 'px' : '');
                    
                    initRigDOM();
                });
            });
        }

        const poses = {
            idle: (t) => {
                boneTargetAngles.torso = Math.sin(t * 0.04) * 0.03;
                boneTargetAngles.head = Math.sin(t * 0.04) * 0.08;
                boneTargetAngles.r_arm = 0.1 + Math.sin(t * 0.04) * 0.1;
                boneTargetAngles.l_arm = -0.1 - Math.sin(t * 0.04) * 0.1;
                boneTargetAngles.r_leg = 0.05;
                boneTargetAngles.l_leg = -0.05;
            },
            walk: (t) => {
                boneTargetAngles.torso = Math.sin(t * 0.08) * 0.05;
                boneTargetAngles.head = Math.sin(t * 0.08) * 0.06;
                boneTargetAngles.r_arm = Math.sin(t * 0.08) * 0.6;
                boneTargetAngles.l_arm = -Math.sin(t * 0.08) * 0.6;
                boneTargetAngles.r_leg = -Math.sin(t * 0.08) * 0.5;
                boneTargetAngles.l_leg = Math.sin(t * 0.08) * 0.5;
            },
            dance: (t) => {
                boneTargetAngles.torso = Math.sin(t * 0.15) * 0.15;
                boneTargetAngles.head = Math.cos(t * 0.15) * 0.2;
                boneTargetAngles.r_arm = -1.5 + Math.sin(t * 0.15) * 0.8;
                boneTargetAngles.l_arm = 1.5 + Math.cos(t * 0.15) * 0.8;
                boneTargetAngles.r_leg = Math.sin(t * 0.15) * 0.4;
                boneTargetAngles.l_leg = -Math.sin(t * 0.15) * 0.4;
            }
        };

        function updatePhysics() {
            if (isPlaying) {
                animTime += 1;
                if (poses[currentPose]) {
                    poses[currentPose](animTime);
                }
            }

            for (let key in boneAngles) {
                let diff = boneTargetAngles[key] - boneAngles[key];
                boneAngles[key] += diff * (boneLags[key] || 0.1);
            }
        }

        const rigContainer = document.getElementById('characterRig');

        function initRigDOM() {
            rigContainer.innerHTML = '';
            const torsoConfig = bonesConfig.torso;
            
            const torsoDiv = document.createElement('div');
            torsoDiv.className = 'bone-node';
            torsoDiv.id = 'bone_torso';
            torsoDiv.style.zIndex = torsoConfig.zIndex;
            
            const torsoImg = document.createElement('img');
            torsoImg.src = boneImages.torso;
            torsoImg.className = 'body-part-img';
            torsoImg.style.width = torsoConfig.width + 'px';
            torsoImg.style.height = torsoConfig.height + 'px';
            torsoImg.style.left = `-${torsoConfig.width / 2}px`;
            torsoImg.style.top = `-${torsoConfig.height / 2}px`;
            torsoDiv.appendChild(torsoImg);

            ['head', 'r_arm', 'l_arm', 'r_leg', 'l_leg'].forEach(bName => {
                const bConfig = bonesConfig[bName];
                const bDiv = document.createElement('div');
                bDiv.className = 'bone-node';
                bDiv.id = `bone_${bName}`;
                bDiv.style.zIndex = bConfig.zIndex;
                bDiv.style.transformOrigin = bConfig.origin;
                
                const bImg = document.createElement('img');
                bImg.src = boneImages[bName];
                bImg.className = 'body-part-img';
                bImg.style.width = bConfig.width + 'px';
                bImg.style.height = bConfig.height + 'px';
                
                if (bConfig.origin === 'top center') {
                    bImg.style.left = `-${bConfig.width / 2}px`;
                    bImg.style.top = '0px';
                } else if (bConfig.origin === 'bottom center') {
                    bImg.style.left = `-${bConfig.width / 2}px`;
                    bImg.style.bottom = '0px';
                }
                bDiv.appendChild(bImg);
                torsoDiv.appendChild(bDiv);
            });

            rigContainer.appendChild(torsoDiv);
        }

        function animationLoop() {
            updatePhysics();
            
            const torsoDiv = document.getElementById('bone_torso');
            if (torsoDiv) {
                const torsoConfig = bonesConfig.torso;
                let extraY = Math.sin(animTime * 0.08) * 3;
                torsoDiv.style.transform = `translate(${torsoConfig.x}px, ${torsoConfig.y + extraY}px) rotate(${boneAngles.torso}rad)`;
                
                ['head', 'r_arm', 'l_arm', 'r_leg', 'l_leg'].forEach((bName, idx) => {
                    const bDiv = torsoDiv.children[idx + 1];
                    const bConfig = bonesConfig[bName];
                    if (bDiv) {
                        bDiv.style.transform = `translate(${bConfig.x}px, ${bConfig.y}px) rotate(${boneAngles[bName]}rad)`;
                    }
                });
            }

            requestAnimationFrame(animationLoop);
        }

        document.getElementById('animSelect').addEventListener('change', (e) => {
            currentPose = e.target.value;
            animTime = 0;
        });

        const toggleBtn = document.getElementById('toggleBtn');
        toggleBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            toggleBtn.textContent = isPlaying ? "إيقاف مؤقت" : "تشغيل";
            toggleBtn.style.background = isPlaying ? "#4CAF50" : "#ff9800";
        });

        buildUploadSlots();
        initRigDOM();
        requestAnimationFrame(animationLoop);
    </script>
</body>
</html>
