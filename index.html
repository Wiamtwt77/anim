<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twencraft Upload Studio - نظام الرسوم المتحركة العضوي السلس</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Tahoma', sans-serif;
            background: #1a1a1a;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .app-container {
            display: flex;
            gap: 20px;
            max-width: 1020px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }
        .sidebar {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            width: 360px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            max-height: 600px;
            overflow-y: auto;
        }
        .stage-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .library-bar {
            background: #2a2a2a;
            padding: 12px 20px;
            border-radius: 8px;
            width: 100%;
            display: flex;
            gap: 15px;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            flex-wrap: wrap;
        }
        .control-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-size: 12px;
            color: #ffeb3b;
        }
        select, input[type="range"], button {
            width: 100%;
            background: #333;
            color: #fff;
            border: 1px solid #444;
            padding: 8px;
            border-radius: 4px;
        }
        select, button { cursor: pointer; }
        button {
            background: #4CAF50;
            font-weight: bold;
            border: none;
            transition: background 0.2s;
        }
        button:hover { background: #45a049; }
        .stage {
            width: 400px;
            height: 500px;
            background: #252525;
            border: 2px dashed #444;
            border-radius: 12px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }
        .character-rig {
            position: relative;
            width: 0;
            height: 0;
        }
        .bone-node {
            position: absolute;
            width: 0;
            height: 0;
        }
        .body-part {
            position: absolute;
            user-select: none;
            pointer-events: none;
        }
        .bone-control {
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #444;
            font-size: 13px;
        }
        .bone-control label {
            display: flex;
            justify-content: space-between;
            color: #4CAF50;
            font-weight: bold;
            margin-bottom: 6px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- لوحة التحكم الهيكلي ومحرك الحركات -->
        <div class="sidebar">
            <div style="font-weight: bold; margin-bottom: 12px; color: #ffeb3b; font-size: 15px;">نظام الهيكل والمفاصل الـ 6</div>
            <div id="bonesControls"></div>
        </div>

        <div class="stage-container">
            <div class="library-bar">
                <div class="control-group">
                    <label for="characterSelect">المكتبة:</label>
                    <select id="characterSelect"></select>
                </div>
                <div class="control-group">
                    <label for="animSelect">مكتبة التحركات السلسة:</label>
                    <select id="animSelect"></select>
                </div>
                <div style="width: 110px;">
                    <label style="opacity: 0;">تشغيل</label>
                    <button id="toggleAnimBtn">إيقاف مؤقت</button>
                </div>
            </div>

            <div class="stage">
                <div class="character-rig" id="characterRig"></div>
            </div>
        </div>
    </div>

    <script>
        // هيكل بيانات الشخصية
        const charactersData = [
            {
                id: "hero_mascot",
                name: "الشخصية الأساسية (تحريك عضوي)",
                rootBone: "torso",
                bones: {
                    torso: {
                        src: "./res/torso.png",
                        width: 74,
                        x: 0,
                        y: -32,
                        zIndex: 3,
                        origin: "center center",
                        minRot: -45, maxRot: 45,
                        children: ["head", "right_arm", "left_arm", "right_leg", "left_leg"]
                    },
                    head: {
                        src: "./res/head.png",
                        width: 88,
                        x: 0,
                        y: -55,
                        zIndex: 4,
                        origin: "bottom center",
                        minRot: -60, maxRot: 60,
                        children: []
                    },
                    right_arm: {
                        src: "./res/right_arm.png",
                        width: 32,
                        x: 25,
                        y: -38,
                        zIndex: 3,
                        origin: "top center",
                        minRot: -180, maxRot: 180,
                        children: []
                    },
                    left_arm: {
                        src: "./res/left_arm.png",
                        width: 32,
                        x: -25,
                        y: -38,
                        zIndex: 3,
                        origin: "top center",
                        minRot: -180, maxRot: 180,
                        children: []
                    },
                    right_leg: {
                        src: "./res/right_leg.png",
                        width: 32,
                        x: 18,
                        y: 40,
                        zIndex: 1,
                        origin: "top center",
                        minRot: -90, maxRot: 90,
                        children: []
                    },
                    left_leg: {
                        src: "./res/left_leg.png",
                        width: 25,
                        x: -15,
                        y: 40,
                        zIndex: 1,
                        origin: "top center",
                        minRot: -90, maxRot: 90,
                        children: []
                    }
                }
            }
        ];

        // مكتبة الحركات مع فريمات غنية
        const animationsLibrary = {
            none: {
                name: "وضعيات يدوية (حر)",
                frames: []
            },
            idle: {
                name: "تنفس / وقفة استعداد (هادئ)",
                duration: 90,
                keyframes: [
                    { frame: 0, rot: { head: 0, right_arm: 5, left_arm: -5, right_leg: 0, left_leg: 0, torso: 0 } },
                    { frame: 45, rot: { head: 4, right_arm: 10, left_arm: -10, right_leg: 3, left_leg: -3, torso: 2 } },
                    { frame: 90, rot: { head: 0, right_arm: 5, left_arm: -5, right_leg: 0, left_leg: 0, torso: 0 } }
                ]
            },
            wave: {
                name: "تلويح باليد الاحترافي (حيوي)",
                duration: 60,
                keyframes: [
                    { frame: 0, rot: { head: 0, right_arm: 10, left_arm: -10, right_leg: 0, left_leg: 0, torso: 0 } },
                    { frame: 15, rot: { head: -12, right_arm: -115, left_arm: -15, right_leg: 0, left_leg: 0, torso: 6 } },
                    { frame: 30, rot: { head: 12, right_arm: -75, left_arm: -15, right_leg: 0, left_leg: 0, torso: -6 } },
                    { frame: 45, rot: { head: -12, right_arm: -115, left_arm: -15, right_leg: 0, left_leg: 0, torso: 6 } },
                    { frame: 60, rot: { head: 0, right_arm: 10, left_arm: -10, right_leg: 0, left_leg: 0, torso: 0 } }
                ]
            },
            walk: {
                name: "مشية واقعية سلسة (متطور)",
                duration: 40,
                keyframes: [
                    { frame: 0, rot: { head: 0, right_arm: 45, left_arm: -45, right_leg: -30, left_leg: 30, torso: 3 } },
                    { frame: 10, rot: { head: 5, right_arm: 15, left_arm: -15, right_leg: 0, left_leg: 0, torso: 0 } },
                    { frame: 20, rot: { head: 0, right_arm: -45, left_arm: 45, right_leg: 30, left_leg: -30, torso: -3 } },
                    { frame: 30, rot: { head: -5, right_arm: -15, left_arm: 15, right_leg: 0, left_leg: 0, torso: 0 } },
                    { frame: 40, rot: { head: 0, right_arm: 45, left_arm: -45, right_leg: -30, left_leg: 30, torso: 3 } }
                ]
            },
            dance: {
                name: "رقصة هيب هوب حماسية (فريمات عالية)",
                duration: 80,
                keyframes: [
                    { frame: 0, rot: { head: 0, right_arm: 0, left_arm: 0, right_leg: 0, left_leg: 0, torso: 0 } },
                    { frame: 20, rot: { head: 18, right_arm: -125, left_arm: 50, right_leg: 20, left_leg: -20, torso: 12 } },
                    { frame: 40, rot: { head: -18, right_arm: 50, left_arm: -125, right_leg: -20, left_leg: 20, torso: -12 } },
                    { frame: 60, rot: { head: 12, right_arm: -95, left_arm: -95, right_leg: 25, left_leg: 25, torso: 0 } },
                    { frame: 80, rot: { head: 0, right_arm: 0, left_arm: 0, right_leg: 0, left_leg: 0, torso: 0 } }
                ]
            }
        };

        let activeCharacterIndex = 0;
        let activeAnimKey = "none";
        let isPlaying = true;
        let currentFrame = 0;

        let boneRotations = {
            head: 0,
            right_arm: 0,
            left_arm: 0,
            right_leg: 0,
            left_leg: 0,
            torso: 0
        };

        const rigContainer = document.getElementById('characterRig');
        const characterSelect = document.getElementById('characterSelect');
        const animSelect = document.getElementById('animSelect');
        const bonesControls = document.getElementById('bonesControls');
        const toggleAnimBtn = document.getElementById('toggleAnimBtn');

        function initLibraries() {
            characterSelect.innerHTML = '';
            charactersData.forEach((char, index) => {
                const opt = document.createElement('option');
                opt.value = index;
                opt.textContent = char.name;
                characterSelect.appendChild(opt);
            });

            animSelect.innerHTML = '';
            for (const [key, anim] of Object.entries(animationsLibrary)) {
                const opt = document.createElement('option');
                opt.value = key;
                opt.textContent = anim.name;
                animSelect.appendChild(opt);
            }
        }

        // دالة التخفيف العضوية (Ease In Out Sine) لمنع الخطية والجمود وتحقيق مرونة فائقة
        function easeInOutSine(t) {
            return -(Math.cos(Math.PI * t) - 1) / 2;
        }

        // محرك الاستيفاء مع تطبيق Easing للحركة الطبيعية السلسة
        function updateAnimationInterpolation() {
            if (activeAnimKey !== "none" && isPlaying) {
                const anim = animationsLibrary[activeAnimKey];
                currentFrame = (currentFrame + 0.4) % anim.duration; // سرعة متوازنة وناعمة
                
                const kfs = anim.keyframes;
                let prevKf = kfs[0], nextKf = kfs[1];
                
                for (let i = 0; i < kfs.length - 1; i++) {
                    if (currentFrame >= kfs[i].frame && currentFrame <= kfs[i+1].frame) {
                        prevKf = kfs[i];
                        nextKf = kfs[i+1];
                        break;
                    }
                }

                const frameRange = nextKf.frame - prevKf.frame;
                const rawProgress = frameRange === 0 ? 0 : (currentFrame - prevKf.frame) / frameRange;
                
                // تحويل التقدم الخطي إلى تقدم عضوي مرن (Non-linear)
                const smoothProgress = easeInOutSine(rawProgress);

                for (let boneName in boneRotations) {
                    const r1 = prevKf.rot[boneName] || 0;
                    const r2 = nextKf.rot[boneName] || 0;
                    boneRotations[boneName] = Math.round(r1 + (r2 - r1) * smoothProgress);
                    
                    const slider = document.querySelector(`input[data-part="${boneName}"]`);
                    const valSpan = document.getElementById(`val_${boneName}`);
                    if (slider && valSpan && activeAnimKey !== "none") {
                        slider.value = boneRotations[boneName];
                        valSpan.textContent = boneRotations[boneName] + '°';
                    }
                }
                renderCharacter();
            }
            requestAnimationFrame(updateAnimationInterpolation);
        }

        function createBoneElement(boneName, bonesDict) {
            const bone = bonesDict[boneName];
            const rot = boneRotations[boneName] || 0;
            
            const nodeDiv = document.createElement('div');
            nodeDiv.className = 'bone-node';
            nodeDiv.style.zIndex = bone.zIndex;

            if (bone.origin === 'top center') {
                nodeDiv.style.transformOrigin = 'top center';
            } else if (bone.origin === 'bottom center') {
                nodeDiv.style.transformOrigin = 'bottom center';
            } else {
                nodeDiv.style.transformOrigin = 'center center';
            }

            nodeDiv.style.transform = `translate(${bone.x}px, ${bone.y}px) rotate(${rot}deg)`;

            const img = document.createElement('img');
            img.src = bone.src;
            img.className = 'body-part';
            img.style.width = bone.width + 'px';
            
            if (bone.origin === 'top center') {
                img.style.left = '50%';
                img.style.top = '0';
                img.style.transform = 'translateX(-50%)';
            } else if (bone.origin === 'bottom center') {
                img.style.left = '50%';
                img.style.bottom = '0';
                img.style.transform = 'translateX(-50%)';
            } else {
                img.style.left = '50%';
                img.style.top = '50%';
                img.style.transform = 'translate(-50%, -50%)';
            }
            
            nodeDiv.appendChild(img);

            if (bone.children && bone.children.length > 0) {
                bone.children.forEach(childName => {
                    nodeDiv.appendChild(createBoneElement(childName, bonesDict));
                });
            }

            return nodeDiv;
        }

        function renderCharacter() {
            const char = charactersData[activeCharacterIndex];
            rigContainer.innerHTML = '';
            rigContainer.appendChild(createBoneElement(char.rootBone, char.bones));
        }

        function buildBoneControls() {
            bonesControls.innerHTML = '';
            const char = charactersData[activeCharacterIndex];

            for (const [partName, bone] of Object.entries(char.bones)) {
                const currentRot = boneRotations[partName] || 0;
                const div = document.createElement('div');
                div.className = 'bone-control';
                div.innerHTML = `
                    <label><span>مفصل: ${partName}</span><span id="val_${partName}">${currentRot}°</span></label>
                    <input type="range" min="${bone.minRot}" max="${bone.maxRot}" value="${currentRot}" data-part="${partName}">
                `;
                bonesControls.appendChild(div);
            }

            bonesControls.querySelectorAll('input[type="range"]').forEach(slider => {
                slider.addEventListener('input', (e) => {
                    if (activeAnimKey === "none") {
                        const part = e.target.dataset.part;
                        const val = parseInt(e.target.value);
                        boneRotations[part] = val;
                        document.getElementById(`val_${part}`).textContent = val + '°';
                        renderCharacter();
                    }
                });
            });
        }

        characterSelect.addEventListener('change', (e) => {
            activeCharacterIndex = parseInt(e.target.value);
            Object.keys(boneRotations).forEach(k => boneRotations[k] = 0);
            buildBoneControls();
            renderCharacter();
        });

        animSelect.addEventListener('change', (e) => {
            activeAnimKey = e.target.value;
            currentFrame = 0;
            if (activeAnimKey === "none") {
                Object.keys(boneRotations).forEach(k => boneRotations[k] = 0);
                buildBoneControls();
                renderCharacter();
            }
        });

        toggleAnimBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            toggleAnimBtn.textContent = isPlaying ? "إيقاف مؤقت" : "تشغيل الحركة";
            toggleAnimBtn.style.background = isPlaying ? "#4CAF50" : "#ff9800";
        });

        initLibraries();
        buildBoneControls();
        renderCharacter();
        requestAnimationFrame(updateAnimationInterpolation);
    </script>

</body>
</html>
