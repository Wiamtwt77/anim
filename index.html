<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twencraft Upload Studio - النظام الهيكلي المتسلسل</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Tahoma', sans-serif;
            background: #1a1a1a;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .app-container {
            display: flex;
            gap: 20px;
            max-width: 980px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }
        .sidebar {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            width: 340px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            max-height: 550px;
            overflow-y: auto;
        }
        .stage-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .library-bar {
            background: #2a2a2a;
            padding: 12px 20px;
            border-radius: 8px;
            width: 100%;
            display: flex;
            gap: 10px;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        select, input[type="range"] {
            width: 100%;
            background: #333;
            color: #fff;
            border: 1px solid #444;
            padding: 6px;
            border-radius: 4px;
        }
        select { cursor: pointer; }
        .stage {
            width: 400px;
            height: 500px;
            background: #252525;
            border: 2px dashed #444;
            border-radius: 12px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }
        .character-rig {
            position: relative;
            width: 0;
            height: 0;
        }
        .bone-node {
            position: absolute;
            width: 0;
            height: 0;
        }
        .body-part {
            position: absolute;
            user-select: none;
            pointer-events: none;
        }
        .bone-control {
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #444;
            font-size: 13px;
        }
        .bone-control label {
            display: flex;
            justify-content: space-between;
            color: #4CAF50;
            font-weight: bold;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- لوحة التحكم في المفاصل المتسلسلة -->
        <div class="sidebar">
            <div style="font-weight: bold; margin-bottom: 12px; color: #ffeb3b; font-size: 15px;">نظام الهيكل المتسلسل (المفاصل المرتبطة)</div>
            <div id="bonesControls"></div>
        </div>

        <div class="stage-container">
            <div class="library-bar">
                <label for="characterSelect" style="white-space: nowrap;">المكتبة:</label>
                <select id="characterSelect"></select>
            </div>

            <div class="stage">
                <div class="character-rig" id="characterRig"></div>
            </div>
        </div>
    </div>

    <script>
        // هيكل بيانات الشخصية مع تسلسل هرمي حقيقي للأطراف (أب -> ابن -> حفيد) لمنع الانفصال
        const charactersData = [
            {
                id: "hero_mascot",
                name: "الشخصية الأساسية (نظام الهيكل المتسلسل)",
                rootBone: "torso",
                bones: {
                    torso: {
                        src: "./res/torso.png",
                        width: 74, x: 0, y: -32, zIndex: 2, origin: "center center",
                        minRot: -20, maxRot: 20,
                        children: ["head", "right_upper_arm", "left_upper_arm", "right_thigh", "left_thigh"]
                    },
                    head: {
                        src: "./res/head.png",
                        width: 88, x: 0, y: -55, zIndex: 3, origin: "bottom center",
                        minRot: -45, maxRot: 45,
                        children: []
                    },
                    // الذراع اليمنى (مقسمة ومتسلسلة: عاضد ثم ساعد)
                    right_upper_arm: {
                        src: "./res/right_arm.png",
                        width: 30, x: 35, y: -30, zIndex: 1, origin: "top center",
                        minRot: -90, maxRot: 90,
                        children: ["right_lower_arm"]
                    },
                    right_lower_arm: {
                        src: "./res/right_arm.png",
                        width: 26, x: 0, y: 40, zIndex: 1, origin: "top center",
                        minRot: 0, maxRot: 110,
                        children: []
                    },
                    // الذراع اليسرى (مقسمة ومتسلسلة)
                    left_upper_arm: {
                        src: "./res/left_arm.png",
                        width: 30, x: -35, y: -30, zIndex: 4, origin: "top center",
                        minRot: -90, maxRot: 90,
                        children: ["left_lower_arm"]
                    },
                    left_lower_arm: {
                        src: "./res/left_arm.png",
                        width: 26, x: 0, y: 40, zIndex: 4, origin: "top center",
                        minRot: 0, maxRot: 110,
                        children: []
                    },
                    // الرجل اليمنى (فخذ ثم ساق)
                    right_thigh: {
                        src: "./res/right_leg.png",
                        width: 30, x: 18, y: 35, zIndex: 1, origin: "top center",
                        minRot: -45, maxRot: 45,
                        children: ["right_shin"]
                    },
                    right_shin: {
                        src: "./res/right_leg.png",
                        width: 25, x: 0, y: 40, zIndex: 1, origin: "top center",
                        minRot: 0, maxRot: 90,
                        children: []
                    },
                    // الرجل اليسرى (فخذ ثم ساق)
                    left_thigh: {
                        src: "./res/left_leg.png",
                        width: 25, x: -15, y: 35, zIndex: 1, origin: "top center",
                        minRot: -45, maxRot: 45,
                        children: ["left_shin"]
                    },
                    left_shin: {
                        src: "./res/left_leg.png",
                        width: 22, x: 0, y: 40, zIndex: 1, origin: "top center",
                        minRot: 0, maxRot: 90,
                        children: []
                    }
                }
            }
        ];

        let activeCharacterIndex = 0;
        let boneRotations = {
            torso: 0,
            head: 0,
            right_upper_arm: 0,
            right_lower_arm: 0,
            left_upper_arm: 0,
            left_lower_arm: 0,
            right_thigh: 0,
            right_shin: 0,
            left_thigh: 0,
            left_shin: 0
        };

        const rigContainer = document.getElementById('characterRig');
        const characterSelect = document.getElementById('characterSelect');
        const bonesControls = document.getElementById('bonesControls');

        function initLibrary() {
            characterSelect.innerHTML = '';
            charactersData.forEach((char, index) => {
                const opt = document.createElement('option');
                opt.value = index;
                opt.textContent = char.name;
                characterSelect.appendChild(opt);
            });
        }

        // بناء العقد الشجرية وربط المفصل الحالي بنهاية المفصل السابق بشكل تزامني
        function createBoneElement(boneName, bonesDict) {
            const bone = bonesDict[boneName];
            
            const nodeDiv = document.createElement('div');
            nodeDiv.className = 'bone-node';
            nodeDiv.style.zIndex = bone.zIndex;
            nodeDiv.style.transform = `translate(${bone.x}px, ${bone.y}px)`;

            const img = document.createElement('img');
            img.src = bone.src;
            img.className = 'body-part';
            img.style.width = bone.width + 'px';
            img.style.transformOrigin = bone.origin;
            
            const rot = boneRotations[boneName] || 0;

            if (bone.origin === 'top center') {
                img.style.left = '50%';
                img.style.top = '0';
                img.style.transform = `translateX(-50%) rotate(${rot}deg)`;
            } else if (bone.origin === 'bottom center') {
                img.style.left = '50%';
                img.style.bottom = '0';
                img.style.transform = `translateX(-50%) rotate(${rot}deg)`;
            } else {
                img.style.left = '50%';
                img.style.top = '50%';
                img.style.transform = `translate(-50%, -50%) rotate(${rot}deg)`;
            }
            
            nodeDiv.appendChild(img);

            // تمرير التحويلات تلقائياً للأجزاء الأبناء (المرتبطة بمفصل النهاية)
            if (bone.children && bone.children.length > 0) {
                bone.children.forEach(childName => {
                    nodeDiv.appendChild(createBoneElement(childName, bonesDict));
                });
            }

            return nodeDiv;
        }

        function renderCharacter() {
            const char = charactersData[activeCharacterIndex];
            rigContainer.innerHTML = '';
            rigContainer.appendChild(createBoneElement(char.rootBone, char.bones));
        }

        function buildBoneControls() {
            bonesControls.innerHTML = '';
            const char = charactersData[activeCharacterIndex];

            for (const [partName, bone] of Object.entries(char.bones)) {
                const currentRot = boneRotations[partName] || 0;
                const div = document.createElement('div');
                div.className = 'bone-control';
                div.innerHTML = `
                    <label><span>مفصل: ${partName}</span><span id="val_${partName}">${currentRot}°</span></label>
                    <input type="range" min="${bone.minRot}" max="${bone.maxRot}" value="${currentRot}" data-part="${partName}">
                `;
                bonesControls.appendChild(div);
            }

            bonesControls.querySelectorAll('input[type="range"]').forEach(slider => {
                slider.addEventListener('input', (e) => {
                    const part = e.target.dataset.part;
                    const val = parseInt(e.target.value);
                    boneRotations[part] = val;
                    document.getElementById(`val_${part}`).textContent = val + '°';
                    renderCharacter();
                });
            });
        }

        characterSelect.addEventListener('change', (e) => {
            activeCharacterIndex = parseInt(e.target.value);
            Object.keys(boneRotations).forEach(k => boneRotations[k] = 0);
            buildBoneControls();
            renderCharacter();
        });

        initLibrary();
        buildBoneControls();
        renderCharacter();
    </script>

</body>
</html>
