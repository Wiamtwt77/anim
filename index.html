<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twencraft Upload Studio - نظام التحريك والوضعيات المتقدم</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Tahoma', sans-serif;
            background: #1a1a1a;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .app-container {
            display: flex;
            gap: 20px;
            max-width: 980px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }
        .sidebar {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            width: 340px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            max-height: 550px;
            overflow-y: auto;
        }
        .stage-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .library-bar {
            background: #2a2a2a;
            padding: 12px 20px;
            border-radius: 8px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .control-row {
            display: flex;
            gap: 10px;
            align-items: center;
            width: 100%;
        }
        select, input[type="range"], button {
            width: 100%;
            background: #333;
            color: #fff;
            border: 1px solid #444;
            padding: 6px;
            border-radius: 4px;
        }
        select, button { cursor: pointer; }
        button {
            background: #4CAF50;
            border: none;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background: #45a049; }
        button.stop-btn { background: #e53935; }
        button.stop-btn:hover { background: #d32f2f; }
        .stage {
            width: 400px;
            height: 500px;
            background: #252525;
            border: 2px dashed #444;
            border-radius: 12px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }
        .character-rig {
            position: relative;
            width: 0;
            height: 0;
        }
        .bone-node {
            position: absolute;
            width: 0;
            height: 0;
        }
        .body-part {
            position: absolute;
            user-select: none;
            pointer-events: none;
        }
        .bone-control {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #444;
            font-size: 13px;
        }
        .bone-control label {
            display: flex;
            justify-content: space-between;
            color: #4CAF50;
            font-weight: bold;
            margin-bottom: 6px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- لوحة التحكم الهيكلي للمفاصل والوضعيات -->
        <div class="sidebar">
            <div style="font-weight: bold; margin-bottom: 12px; color: #ffeb3b; font-size: 15px;">نظام الهيكل العظمي (6 مفاصل والوضعيات)</div>
            <div id="bonesControls"></div>
        </div>

        <div class="stage-container">
            <div class="library-bar">
                <div class="control-row">
                    <label for="characterSelect" style="white-space: nowrap; width: 60px;">المكتبة:</label>
                    <select id="characterSelect"></select>
                </div>
                <div class="control-row">
                    <label for="animationSelect" style="white-space: nowrap; width: 60px;">الأنيميشن:</label>
                    <select id="animationSelect"></select>
                </div>
                <div class="control-row">
                    <button id="playBtn">تشغيل الأنيميشن السلس</button>
                    <button id="stopBtn" class="stop-btn">إيقاف</button>
                </div>
            </div>

            <div class="stage">
                <div class="character-rig" id="characterRig"></div>
            </div>
        </div>
    </div>

    <script>
        // هيكل بيانات الشخصية (مع ضبط طبقات Z-Index ومركز الدوران عند الكتف والحوض)
        const charactersData = [
            {
                id: "hero_mascot",
                name: "الشخصية الأساسية (6 مفاصل متصلة)",
                rootBone: "torso",
                bones: {
                    torso: {
                        src: "./res/torso.png",
                        width: 74,
                        x: 0,
                        y: -32,
                        zIndex: 3, // الطبقة الوسطى (مع الصدر والذراعان)
                        origin: "center center",
                        minRot: -20, maxRot: 20,
                        children: ["head", "right_arm", "left_arm", "right_leg", "left_leg"]
                    },
                    head: {
                        src: "./res/head.png",
                        width: 88,
                        x: 0,
                        y: -55,
                        zIndex: 4, // الطبقة الأولى في الأعلى تماماً
                        origin: "bottom center",
                        minRot: -45, maxRot: 45,
                        children: []
                    },
                    right_arm: {
                        src: "./res/right_arm.png",
                        width: 32,
                        x: 25,
                        y: -38,
                        zIndex: 3, // في نفس طبقة الصدر وتحت الرأس، ومركز الدوران هو مفصل الكتف
                        origin: "top center",
                        minRot: -90, maxRot: 90,
                        children: []
                    },
                    left_arm: {
                        src: "./res/left_arm.png",
                        width: 32,
                        x: -25,
                        y: -38,
                        zIndex: 3, // في نفس طبقة الصدر وتحت الرأس، ومركز الدوران هو مفصل الكتف
                        origin: "top center",
                        minRot: -90, maxRot: 90,
                        children: []
                    },
                    right_leg: {
                        src: "./res/right_leg.png",
                        width: 32,
                        x: 18,
                        y: 40,
                        zIndex: 1, // تحتهم كلهم في الأسفل
                        origin: "top center",
                        minRot: -45, maxRot: 45,
                        children: []
                    },
                    left_leg: {
                        src: "./res/left_leg.png",
                        width: 25,
                        x: -15,
                        y: 40,
                        zIndex: 1, // تحتهم كلهم في الأسفل
                        origin: "top center",
                        minRot: -45, maxRot: 45,
                        children: []
                    }
                }
            }
        ];

        // مكتبة الأنيميشن والوضعيات السلسة متعددة الفريمات
        const animationsLibrary = {
            none: {
                name: "وضعيات يدوية (بدون أنيميشن)",
                frames: []
            },
            idle: {
                name: "التنفس والوقوف الهادئ (Idle)",
                frames: [
                    { head: 0, torso: 0, right_arm: 2, left_arm: -2, right_leg: 0, left_leg: 0 },
                    { head: 2, torso: 1, right_arm: 4, left_arm: -4, right_leg: 1, left_leg: -1 },
                    { head: 4, torso: 2, right_arm: 6, left_arm: -6, right_leg: 2, left_leg: -2 },
                    { head: 2, torso: 1, right_arm: 4, left_arm: -4, right_leg: 1, left_leg: -1 },
                    { head: 0, torso: 0, right_arm: 2, left_arm: -2, right_leg: 0, left_leg: 0 },
                    { head: -2, torso: -1, right_arm: 0, left_arm: 0, right_leg: -1, left_leg: 1 },
                    { head: -4, torso: -2, right_arm: -2, left_arm: 2, right_leg: -2, left_leg: 2 },
                    { head: -2, torso: -1, right_arm: 0, left_arm: 0, right_leg: -1, left_leg: 1 }
                ]
            },
            walking: {
                name: "المشي المتناسق السلس (Walking)",
                frames: [
                    { head: 2, torso: 5, right_arm: 35, left_arm: -35, right_leg: -25, left_leg: 25 },
                    { head: 0, torso: 2, right_arm: 15, left_arm: -15, right_leg: -10, left_leg: 10 },
                    { head: -2, torso: -2, right_arm: -15, left_arm: 15, right_leg: 10, left_leg: -10 },
                    { head: -3, torso: -5, right_arm: -35, left_arm: 35, right_leg: 25, left_leg: -25 },
                    { head: -2, torso: -2, right_arm: -15, left_arm: 15, right_leg: 10, left_leg: -10 },
                    { head: 0, torso: 2, right_arm: 15, left_arm: -15, right_leg: -10, left_leg: 10 }
                ]
            },
            wave: {
                name: "التلويح والتحية (Waving)",
                frames: [
                    { head: -5, torso: 3, right_arm: -75, left_arm: 0, right_leg: 0, left_leg: 0 },
                    { head: -5, torso: 3, right_arm: -40, left_arm: 0, right_leg: 0, left_leg: 0 },
                    { head: -5, torso: 3, right_arm: -85, left_arm: 0, right_leg: 0, left_leg: 0 },
                    { head: -5, torso: 3, right_arm: -40, left_arm: 0, right_leg: 0, left_leg: 0 },
                    { head: -5, torso: 3, right_arm: -75, left_arm: 0, right_leg: 0, left_leg: 0 },
                    { head: 0, torso: 0, right_arm: 0, left_arm: 0, right_leg: 0, left_leg: 0 }
                ]
            },
            running: {
                name: "الركض السريع والحماسي (Running)",
                frames: [
                    { head: -10, torso: 15, right_arm: 60, left_arm: -60, right_leg: -40, left_leg: 40 },
                    { head: -5, torso: 5, right_arm: 20, left_arm: -20, right_leg: -15, left_leg: 15 },
                    { head: 5, torso: -10, right_arm: -40, left_arm: 40, right_leg: 20, left_leg: -20 },
                    { head: 10, torso: -15, right_arm: -65, left_arm: 65, right_leg: 40, left_leg: -40 },
                    { head: 5, torso: -10, right_arm: -40, left_arm: 40, right_leg: 20, left_leg: -20 },
                    { head: -5, torso: 5, right_arm: 20, left_arm: -20, right_leg: -15, left_leg: 15 }
                ]
            }
        };

        let activeCharacterIndex = 0;
        let boneRotations = {
            head: 0,
            right_arm: 0,
            left_arm: 0,
            right_leg: 0,
            left_leg: 0,
            torso: 0
        };

        let currentAnimKey = "none";
        let animInterval = null;
        let frameIndex = 0;

        const rigContainer = document.getElementById('characterRig');
        const characterSelect = document.getElementById('characterSelect');
        const animationSelect = document.getElementById('animationSelect');
        const bonesControls = document.getElementById('bonesControls');
        const playBtn = document.getElementById('playBtn');
        const stopBtn = document.getElementById('stopBtn');

        function initLibrary() {
            characterSelect.innerHTML = '';
            charactersData.forEach((char, index) => {
                const opt = document.createElement('option');
                opt.value = index;
                opt.textContent = char.name;
                characterSelect.appendChild(opt);
            });

            animationSelect.innerHTML = '';
            Object.keys(animationsLibrary).forEach(key => {
                const opt = document.createElement('option');
                opt.value = key;
                opt.textContent = animationsLibrary[key].name;
                animationSelect.appendChild(opt);
            });
        }

        function createBoneElement(boneName, bonesDict) {
            const bone = bonesDict[boneName];
            const rot = boneRotations[boneName] || 0;
            
            const nodeDiv = document.createElement('div');
            nodeDiv.className = 'bone-node';
            nodeDiv.style.zIndex = bone.zIndex;

            if (bone.origin === 'top center') {
                nodeDiv.style.transformOrigin = 'top center';
            } else if (bone.origin === 'bottom center') {
                nodeDiv.style.transformOrigin = 'bottom center';
            } else {
                nodeDiv.style.transformOrigin = 'center center';
            }

            nodeDiv.style.transform = `translate(${bone.x}px, ${bone.y}px) rotate(${rot}deg)`;

            const img = document.createElement('img');
            img.src = bone.src;
            img.className = 'body-part';
            img.style.width = bone.width + 'px';
            
            if (bone.origin === 'top center') {
                img.style.left = '50%';
                img.style.top = '0';
                img.style.transform = 'translateX(-50%)';
            } else if (bone.origin === 'bottom center') {
                img.style.left = '50%';
                img.style.bottom = '0';
                img.style.transform = 'translateX(-50%)';
            } else {
                img.style.left = '50%';
                img.style.top = '50%';
                img.style.transform = 'translate(-50%, -50%)';
            }
            
            nodeDiv.appendChild(img);

            if (bone.children && bone.children.length > 0) {
                bone.children.forEach(childName => {
                    nodeDiv.appendChild(createBoneElement(childName, bonesDict));
                });
            }

            return nodeDiv;
        }

        function renderCharacter() {
            const char = charactersData[activeCharacterIndex];
            rigContainer.innerHTML = '';
            rigContainer.appendChild(createBoneElement(char.rootBone, char.bones));
        }

        function updateSlidersUI() {
            for (const [partName, val] of Object.entries(boneRotations)) {
                const slider = document.querySelector(`input[data-part="${partName}"]`);
                const valSpan = document.getElementById(`val_${partName}`);
                if (slider && valSpan) {
                    slider.value = val;
                    valSpan.textContent = val + '°';
                }
            }
        }

        function buildBoneControls() {
            bonesControls.innerHTML = '';
            const char = charactersData[activeCharacterIndex];

            for (const [partName, bone] of Object.entries(char.bones)) {
                const currentRot = boneRotations[partName] || 0;
                const div = document.createElement('div');
                div.className = 'bone-control';
                div.innerHTML = `
                    <label><span>مفصل: ${partName}</span><span id="val_${partName}">${currentRot}°</span></label>
                    <input type="range" min="${bone.minRot}" max="${bone.maxRot}" value="${currentRot}" data-part="${partName}">
                `;
                bonesControls.appendChild(div);
            }

            bonesControls.querySelectorAll('input[type="range"]').forEach(slider => {
                slider.addEventListener('input', (e) => {
                    stopAnimation(); // إيقاف الأنيميشن عند التدخل اليدوي
                    animationSelect.value = "none";
                    const part = e.target.dataset.part;
                    const val = parseInt(e.target.value);
                    boneRotations[part] = val;
                    document.getElementById(`val_${part}`).textContent = val + '°';
                    renderCharacter();
                });
            });
        }

        function startAnimation() {
            stopAnimation();
            currentAnimKey = animationSelect.value;
            if (currentAnimKey === "none") return;

            const anim = animationsLibrary[currentAnimKey];
            if (!anim || !anim.frames || anim.frames.length === 0) return;

            frameIndex = 0;
            animInterval = setInterval(() => {
                const frame = anim.frames[frameIndex];
                for (const [part, rot] of Object.entries(frame)) {
                    boneRotations[part] = rot;
                }
                updateSlidersUI();
                renderCharacter();

                frameIndex = (frameIndex + 1) % anim.frames.length;
            }, 100); // سرعة السلاسة بين الفريمات (100ms)
        }

        function stopAnimation() {
            if (animInterval) {
                clearInterval(animInterval);
                animInterval = null;
            }
        }

        characterSelect.addEventListener('change', (e) => {
            activeCharacterIndex = parseInt(e.target.value);
            Object.keys(boneRotations).forEach(k => boneRotations[k] = 0);
            stopAnimation();
            animationSelect.value = "none";
            buildBoneControls();
            renderCharacter();
        });

        animationSelect.addEventListener('change', () => {
            if (animationSelect.value === "none") {
                stopAnimation();
            } else {
                startAnimation();
            }
        });

        playBtn.addEventListener('click', () => {
            startAnimation();
        });

        stopBtn.addEventListener('click', () => {
            stopAnimation();
            animationSelect.value = "none";
        });

        initLibrary();
        buildBoneControls();
        renderCharacter();
    </script>

</body>
</html>
