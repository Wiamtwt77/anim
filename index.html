<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استوديو تحريك الشخصيات - Character Studio</title>
    <style>
        :root {
            --bg-color: #1e1e24;
            --panel-bg: #2d2d38;
            --accent-color: #ff6b81;
            --text-color: #f1f2f6;
            --border-radius: 12px;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            margin-bottom: 20px;
            text-align: center;
        }
        h1 {
            margin: 0;
            font-size: 1.8rem;
            color: var(--accent-color);
        }
        .main-container {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1000px;
            background: var(--panel-bg);
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        .canvas-area {
            flex: 1;
            background: #ffffff;
            border-radius: var(--border-radius);
            position: relative;
            height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }
        /* حاوية أجزاء الشخصية */
        #character-container {
            position: relative;
            width: 300px;
            height: 400px;
        }
        .char-part {
            position: absolute;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            user-select: none;
            pointer-events: none;
            left: 0;
            top: 0;
        }
        /* ترتيب الطبقات (Z-Index) */
        #part-chest { z-index: 1; }
        #part-head { z-index: 2; }
        #part-hair { z-index: 3; }

        .sidebar {
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .panel {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: var(--border-radius);
        }
        .panel h3 {
            margin-top: 0;
            font-size: 1.1rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 8px;
        }
        .part-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            margin-bottom: 8px;
            background: rgba(255,255,258,0.08);
            border-radius: 8px;
            font-size: 0.95rem;
        }
        .status {
            font-size: 0.85rem;
            color: #2ed573;
        }
    </style>
</head>
<body>

    <header>
        <h1>استوديو تحريك الشخصيات الافتراضية</h1>
        <p>القاعدة الأساسية لقراءة أجزاء الشخصية من ملف list.json</p>
    </header>

    <div class="main-container">
        <!-- منطقة عرض الشخصية -->
        <div class="canvas-area">
            <div id="character-container">
                <!-- ستُحقن صور الأجزاء هنا برمجياً -->
            </div>
        </div>

        <!-- الشريط الجانبي لعرض الأجزاء -->
        <div class="sidebar">
            <div class="panel">
                <h3>الأجزاء المحملة</h3>
                <div id="parts-list-ui">
                    <!-- سيتم تحديث القائمة تلقائياً -->
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const container = document.getElementById("character-container");
            const partsListUi = document.getElementById("parts-list-ui");

            // جلب بيانات الشخصية عبر list.json
            fetch('./list.json')
                .then(response => {
                    if (!response.ok) throw new Error("تعذر تحميل ملف list.json");
                    return response.json();
                })
                .then(parts => {
                    partsListUi.innerHTML = "";
                    container.innerHTML = "";

                    parts.forEach(part => {
                        // 1. بناء عنصر الصورة داخل مساحة العمل
                        const img = document.createElement("img");
                        img.src = part.src;
                        img.alt = part.n;
                        img.id = `part-${part.id}`;
                        img.className = "char-part";
                        container.appendChild(img);

                        // 2. إظهار العنصر في القائمة الجانبية كدليل على نجاح التحميل
                        const itemUi = document.createElement("div");
                        itemUi.className = "part-item";
                        itemUi.innerHTML = `<span>${part.n} (${part.id})</span> <span class="status">تم التحميل ✓</span>`;
                        partsListUi.appendChild(itemUi);
                    });
                })
                .catch(error => {
                    console.error("خطأ:", error);
                    partsListUi.innerHTML = `<p style="color: #ff4757; font-size: 0.85rem;">خطأ: تأكد من صحة مسارات الصور وملف list.json.</p>`;
                });
        });
    </script>
</body>
</html>
