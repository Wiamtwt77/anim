<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twencraft Upload Studio - نظام المفاصل الدقيق</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Tahoma', sans-serif;
            background: #1a1a1a;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .app-container {
            display: flex;
            gap: 20px;
            max-width: 980px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }
        .sidebar {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            width: 340px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            max-height: 550px;
            overflow-y: auto;
        }
        .stage-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .library-bar {
            background: #2a2a2a;
            padding: 12px 20px;
            border-radius: 8px;
            width: 100%;
            display: flex;
            gap: 10px;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        select, input[type="range"] {
            width: 100%;
            background: #333;
            color: #fff;
            border: 1px solid #444;
            padding: 6px;
            border-radius: 4px;
        }
        select { cursor: pointer; }
        .stage {
            width: 400px;
            height: 500px;
            background: #252525;
            border: 2px dashed #444;
            border-radius: 12px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }
        .character-rig {
            position: relative;
            width: 0;
            height: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .bone-joint {
            position: absolute;
            width: 0;
            height: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .body-part {
            position: absolute;
            user-select: none;
            pointer-events: none;
        }
        .bone-control {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #444;
            font-size: 12px;
        }
        .bone-control label {
            display: flex;
            justify-content: space-between;
            color: #4CAF50;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .control-row {
            display: flex;
            gap: 10px;
            margin-top: 5px;
            align-items: center;
        }
        .control-row span { min-width: 50px; color: #aaa; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- لوحة التحكم المتقدمة للعظام والمفاصل -->
        <div class="sidebar">
            <div style="font-weight: bold; margin-bottom: 12px; color: #ffeb3b; font-size: 15px;">معايرة المفاصل والدوران</div>
            <div id="bonesControls"></div>
        </div>

        <div class="stage-container">
            <div class="library-bar">
                <label for="characterSelect" style="white-space: nowrap;">المكتبة:</label>
                <select id="characterSelect"></select>
            </div>

            <div class="stage">
                <div class="character-rig" id="characterRig"></div>
            </div>
        </div>
    </div>

    <script>
        const charactersData = [
            {
                id: "hero_mascot",
                name: "الشخصية الأساسية (الافتراضية)",
                parts: {
                    torso:      { src: "./res/torso.png",      width: 74, x: 1,   y: -37,  zIndex: 2, rotX: 50, rotY: 50 },
                    head:       { src: "./res/head.png",       width: 88, x: 0,   y: -140, zIndex: 3, rotX: 50, rotY: 100 },
                    right_arm:  { src: "./res/right_arm.png",  width: 32, x: 34,  y: -40,  zIndex: 1, rotX: 50, rotY: 10 },
                    left_arm:   { src: "./res/left_arm.png",   width: 32, x: -34, y: -43,  zIndex: 1, rotX: 50, rotY: 10 },
                    right_leg:  { src: "./res/right_leg.png",  width: 32, x: 22,  y: 50,   zIndex: 1, rotX: 50, rotY: 10 },
                    left_leg:   { src: "./res/left_leg.png",   width: 25, x: -22, y: 50,   zIndex: 1, rotX: 50, rotY: 10 }
                }
            }
        ];

        let activeCharacterIndex = 0;
        
        // حفظ بيانات الدوران وموقع نقطة الارتكاز لكل عظمة
        let boneData = {
            head:      { rot: 0, originX: 50, originY: 100 },
            right_arm: { rot: 0, originX: 50, originY: 10 },
            left_arm:  { rot: 0, originX: 50, originY: 10 },
            right_leg: { rot: 0, originX: 50, originY: 10 },
            left_leg:  { rot: 0, originX: 50, originY: 10 },
            torso:     { rot: 0, originX: 50, originY: 50 }
        };

        const rigContainer = document.getElementById('characterRig');
        const characterSelect = document.getElementById('characterSelect');
        const bonesControls = document.getElementById('bonesControls');

        function initLibrary() {
            characterSelect.innerHTML = '';
            charactersData.forEach((char, index) => {
                const opt = document.createElement('option');
                opt.value = index;
                opt.textContent = char.name;
                characterSelect.appendChild(opt);
            });
        }

        function renderCharacter() {
            const char = charactersData[activeCharacterIndex];
            rigContainer.innerHTML = '';

            for (const [partName, info] of Object.entries(char.parts)) {
                const jointDiv = document.createElement('div');
                jointDiv.className = 'bone-joint';
                jointDiv.style.zIndex = info.zIndex;
                jointDiv.style.transform = `translate(${info.x}px, ${info.y}px)`;

                const img = document.createElement('img');
                img.src = info.src;
                img.className = 'body-part';
                img.style.width = info.width + 'px';
                
                const bData = boneData[partName] || { rot: 0, originX: 50, originY: 0 };
                img.style.transformOrigin = `${bData.originX}% ${bData.originY}%`;
                img.style.transform = `rotate(${bData.rot}deg)`;
                
                jointDiv.appendChild(img);
                rigContainer.appendChild(jointDiv);
            }
        }

        function buildBoneControls() {
            bonesControls.innerHTML = '';
            const char = charactersData[activeCharacterIndex];

            for (const partName of Object.keys(char.parts)) {
                const bData = boneData[partName];
                const div = document.createElement('div');
                div.className = 'bone-control';
                div.innerHTML = `
                    <label><span>عظمة: ${partName}</span></label>
                    <div class="control-row">
                        <span>دوران: <b id="rot_val_${partName}">${bData.rot}°</b></span>
                        <input type="range" min="-90" max="90" value="${bData.rot}" data-part="${partName}" data-type="rot">
                    </div>
                    <div class="control-row">
                        <span>محور X: <b id="ox_val_${partName}">${bData.originX}%</b></span>
                        <input type="range" min="0" max="100" value="${bData.originX}" data-part="${partName}" data-type="originX">
                    </div>
                    <div class="control-row">
                        <span>محور Y: <b id="oy_val_${partName}">${bData.originY}%</b></span>
                        <input type="range" min="0" max="100" value="${bData.originY}" data-part="${partName}" data-type="originY">
                    </div>
                `;
                bonesControls.appendChild(div);
            }

            bonesControls.querySelectorAll('input[type="range"]').forEach(slider => {
                slider.addEventListener('input', (e) => {
                    const part = e.target.dataset.part;
                    const type = e.target.dataset.type;
                    const val = parseInt(e.target.value);
                    
                    boneData[part][type] = val;
                    document.getElementById(`${type === 'rot' ? 'rot_val' : type === 'originX' ? 'ox_val' : 'oy_val'}_${part}`).textContent = val + (type === 'rot' ? '°' : '%');
                    
                    renderCharacter();
                });
            });
        }

        characterSelect.addEventListener('change', (e) => {
            activeCharacterIndex = parseInt(e.target.value);
            buildBoneControls();
            renderCharacter();
        });

        initLibrary();
        buildBoneControls();
        renderCharacter();
    </script>

</body>
</html>
