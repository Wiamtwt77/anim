<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twencraft Upload & Animation Studio - تحكم كامل بالأبعاد</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Tahoma', sans-serif;
            background: #141414;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .app-container {
            display: flex;
            gap: 20px;
            max-width: 1180px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }
        .sidebar {
            background: #1f1f1f;
            padding: 15px;
            border-radius: 10px;
            width: 400px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            max-height: 680px;
            overflow-y: auto;
            border: 1px solid #333;
        }
        .stage-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .top-bar {
            background: #1f1f1f;
            padding: 12px 20px;
            border-radius: 10px;
            width: 100%;
            display: flex;
            gap: 15px;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            border: 1px solid #333;
        }
        .control-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-size: 12px;
            color: #ffeb3b;
        }
        select, button, input[type="file"] {
            width: 100%;
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }
        button {
            background: #4CAF50;
            font-weight: bold;
            border: none;
            transition: background 0.2s;
        }
        button:hover { background: #45a049; }
        .stage {
            width: 440px;
            height: 540px;
            background: #1a1a1a;
            border: 2px dashed #444;
            border-radius: 12px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
        }
        .upload-slot {
            background: #252525;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 12px;
            border: 1px solid #333;
        }
        .upload-slot label {
            display: block;
            font-weight: bold;
            color: #4CAF50;
            margin-bottom: 4px;
            font-size: 13px;
        }
        .upload-slot span {
            display: block;
            font-size: 11px;
            color: #aaa;
            margin-bottom: 6px;
        }
        .size-sliders {
            display: flex;
            gap: 10px;
            margin-top: 8px;
            align-items: center;
            font-size: 11px;
            color: #ccc;
        }
        .size-sliders input[type="range"] {
            flex: 1;
            accent-color: #4CAF50;
        }
        /* الهيكل العظمي والمجسمات المرتبطة */
        .character-rig {
            position: relative;
            width: 0;
            height: 0;
        }
        .bone-node {
            position: absolute;
            width: 0;
            height: 0;
        }
        .body-part-img {
            position: absolute;
            user-select: none;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- لوحة رفع الصور والتحكم بالقياسات لكل عظمة -->
        <div class="sidebar">
            <div style="font-weight: bold; margin-bottom: 10px; color: #ffeb3b; font-size: 15px;">استوديو رفع وتعديل مقاسات العظام</div>
            <div style="font-size: 12px; color: #ccc; margin-bottom: 15px; line-height: 1.5;">
                ارفع الصور وعدّل أبعاد العرض (العرض والارتفاع) لكل جزء بشكل مباشر لتتناسب تماماً مع هيكلك.
            </div>

            <div id="uploadSlotsContainer"></div>
        </div>

        <div class="stage-container">
            <div class="top-bar">
                <div class="control-group">
                    <label for="animSelect">مكتبة التحركات العضوية السلسة:</label>
                    <select id="animSelect">
                        <option value="idle">تنفس واستعداد هادئ (Organic Idle)</option>
                        <option value="walk">مشية احترافية مرنة (Fluid Walk)</option>
                        <option value="dance">رقصة حماسية متأرجحة (Dynamic Dance)</option>
                    </select>
                </div>
                <div style="width: 110px;">
                    <label style="opacity: 0;">تشغيل</label>
                    <button id="toggleBtn">إيقاف مؤقت</button>
                </div>
            </div>

            <div class="stage">
                <div class="character-rig" id="characterRig"></div>
            </div>
        </div>
    </div>

    <script>
        const bonesConfig = {
            torso: {
                name: "الجذع الأساسي (Torso)",
                x: 0, y: -20,
                origin: "center center",
                zIndex: 2,
                defaultWidth: 90, defaultHeight: 130,
                defaultImg: generatePlaceholderDataURL('الجذع', '#4CAF50', 90, 130),
                children: ['head', 'r_arm', 'l_arm', 'r_leg', 'l_leg']
            },
            head: {
                name: "الرأس (Head)",
                x: 0, y: -75,
                origin: "bottom center",
                zIndex: 3,
                defaultWidth: 90, defaultHeight: 90,
                defaultImg: generatePlaceholderDataURL('الرأس', '#ffccbc', 90, 90),
                children: []
            },
            r_arm: {
                name: "الذراع اليمنى (Right Arm)",
                x: 35, y: -50,
                origin: "top center",
                zIndex: 2,
                defaultWidth: 35, defaultHeight: 100,
                defaultImg: generatePlaceholderDataURL('ذراع يمنى', '#66bb6a', 35, 100),
                children: []
            },
            l_arm: {
                name: "الذراع اليسرى (Left Arm)",
                x: -35, y: -50,
                origin: "top center",
                zIndex: 2,
                defaultWidth: 35, defaultHeight: 100,
                defaultImg: generatePlaceholderDataURL('ذراع يسرى', '#66bb6a', 35, 100),
                children: []
            },
            r_leg: {
                name: "الرجل اليمنى (Right Leg)",
                x: 20, y: 60,
                origin: "top center",
                zIndex: 1,
                defaultWidth: 40, defaultHeight: 110,
                defaultImg: generatePlaceholderDataURL('رجل يمنى', '#388e3c', 40, 110),
                children: []
            },
            l_leg: {
                name: "الرجل اليسرى (Left Leg)",
                x: -20, y: 60,
                origin: "top center",
                zIndex: 1,
                defaultWidth: 40, defaultHeight: 110,
                defaultImg: generatePlaceholderDataURL('رجل يسرى', '#388e3c', 40, 110),
                children: []
            }
        };

        // تخزين الصور والأبعاد الديناميكية لكل عظمة
        let boneImages = {};
        let boneDimensions = {};

        for (let key in bonesConfig) {
            boneImages[key] = bonesConfig[key].defaultImg;
            boneDimensions[key] = {
                width: bonesConfig[key].defaultWidth,
                height: bonesConfig[key].defaultHeight
            };
        }

        let boneAngles = { torso: 0, head: 0, r_arm: 0, l_arm: 0, r_leg: 0, l_leg: 0 };
        let boneTargetAngles = { torso: 0, head: 0, r_arm: 0, l_arm: 0, r_leg: 0, l_leg: 0 };
        let boneLags = { torso: 0.12, head: 0.15, r_arm: 0.09, l_arm: 0.09, r_leg: 0.1, l_leg: 0.1 };

        let animTime = 0;
        let isPlaying = true;
        let currentPose = 'idle';

        function generatePlaceholderDataURL(text, color, w, h) {
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = color;
            ctx.roundRect ? ctx.roundRect(0, 0, w, h, 10) : ctx.fillRect(0, 0, w, h);
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.fillStyle = '#111';
            ctx.font = 'bold 11px Tahoma';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, w / 2, h / 2);
            return canvas.toDataURL();
        }

        // بناء حقول الرفع مع سلايدرات التحكم في الحجم الفوري لكل جزء
        function buildUploadSlots() {
            const container = document.getElementById('uploadSlotsContainer');
            container.innerHTML = '';

            for (let [key, config] of Object.entries(bonesConfig)) {
                const dim = boneDimensions[key];
                const slot = document.createElement('div');
                slot.className = 'upload-slot';
                slot.innerHTML = `
                    <label>${config.name}</label>
                    <span>رفع صورة الجزء (PNG):</span>
                    <input type="file" accept="image/png, image/jpeg" data-bone="${key}" style="margin-bottom: 8px;">
                    <div class="size-sliders">
                        <span>عرض: <b id="val_w_${key}">${dim.width}</b>px</span>
                        <input type="range" min="10" max="200" value="${dim.width}" data-bone-w="${key}">
                    </div>
                    <div class="size-sliders">
                        <span>ارتفاع: <b id="val_h_${key}">${dim.height}</b>px</span>
                        <input type="range" min="10" max="250" value="${dim.height}" data-bone-h="${key}">
                    </div>
                `;
                container.appendChild(slot);
            }

            // أحداث رفع الملفات
            container.querySelectorAll('input[type="file"]').forEach(input => {
                input.addEventListener('change', (e) => {
                    const boneKey = e.target.dataset.bone;
                    const file = e.target.files[0];
                    if (file) {
                        const url = URL.createObjectURL(file);
                        boneImages[boneKey] = url;
                    }
                });
            });

            // أحداث تعديل العرض والارتفاع الفوري
            container.querySelectorAll('input[type="range"]').forEach(slider => {
                slider.addEventListener('input', (e) => {
                    const wKey = e.target.dataset.boneW;
                    const hKey = e.target.dataset.boneH;

                    if (wKey) {
                        const val = parseInt(e.target.value);
                        boneDimensions[wKey].width = val;
                        document.getElementById(`val_w_${wKey}`).textContent = val;
                    }
                    if (hKey) {
                        const val = parseInt(e.target.value);
                        boneDimensions[hKey].height = val;
                        document.getElementById(`val_h_${hKey}`).textContent = val;
                    }
                });
            });
        }

        const poses = {
            idle: (t) => {
                boneTargetAngles.torso = Math.sin(t * 0.04) * 0.03;
                boneTargetAngles.head = Math.sin(t * 0.04) * 0.08;
                boneTargetAngles.r_arm = 0.1 + Math.sin(t * 0.04) * 0.1;
                boneTargetAngles.l_arm = -0.1 - Math.sin(t * 0.04) * 0.1;
                boneTargetAngles.r_leg = 0.05;
                boneTargetAngles.l_leg = -0.05;
            },
            walk: (t) => {
                boneTargetAngles.torso = Math.sin(t * 0.08) * 0.05;
                boneTargetAngles.head = Math.sin(t * 0.08) * 0.06;
                boneTargetAngles.r_arm = Math.sin(t * 0.08) * 0.6;
                boneTargetAngles.l_arm = -Math.sin(t * 0.08) * 0.6;
                boneTargetAngles.r_leg = -Math.sin(t * 0.08) * 0.5;
                boneTargetAngles.l_leg = Math.sin(t * 0.08) * 0.5;
            },
            dance: (t) => {
                boneTargetAngles.torso = Math.sin(t * 0.15) * 0.15;
                boneTargetAngles.head = Math.cos(t * 0.15) * 0.2;
                boneTargetAngles.r_arm = -1.5 + Math.sin(t * 0.15) * 0.8;
                boneTargetAngles.l_arm = 1.5 + Math.cos(t * 0.15) * 0.8;
                boneTargetAngles.r_leg = Math.sin(t * 0.15) * 0.4;
                boneTargetAngles.l_leg = -Math.sin(t * 0.15) * 0.4;
            }
        };

        function updatePhysics() {
            if (isPlaying) {
                animTime += 1;
                if (poses[currentPose]) {
                    poses[currentPose](animTime);
                }
            }

            for (let key in boneAngles) {
                let diff = boneTargetAngles[key] - boneAngles[key];
                boneAngles[key] += diff * (boneLags[key] || 0.1);
            }
        }

        const rigContainer = document.getElementById('characterRig');

        function initRigDOM() {
            rigContainer.innerHTML = '';
            const torsoDiv = document.createElement('div');
            torsoDiv.className = 'bone-node';
            torsoDiv.id = 'bone_torso';
            torsoDiv.style.zIndex = bonesConfig.torso.zIndex;
            
            const torsoImg = document.createElement('img');
            torsoImg.className = 'body-part-img';
            torsoImg.id = 'img_torso';
            torsoDiv.appendChild(torsoImg);

            ['head', 'r_arm', 'l_arm', 'r_leg', 'l_leg'].forEach(bName => {
                const bConfig = bonesConfig[bName];
                const bDiv = document.createElement('div');
                bDiv.className = 'bone-node';
                bDiv.id = `bone_${bName}`;
                bDiv.style.zIndex = bConfig.zIndex;
                bDiv.style.transformOrigin = bConfig.origin;
                
                const bImg = document.createElement('img');
                bImg.className = 'body-part-img';
                bImg.id = `img_${bName}`;
                
                if (bConfig.origin === 'top center') {
                    bImg.style.top = '0px';
                } else if (bConfig.origin === 'bottom center') {
                    bImg.style.bottom = '0px';
                }
                bDiv.appendChild(bImg);
                torsoDiv.appendChild(bDiv);
            });

            rigContainer.appendChild(torsoDiv);
        }

        function animationLoop() {
            updatePhysics();
            
            // تحديث الأبعاد والرسومات الحية لكل إطار
            for (let key in bonesConfig) {
                const imgEl = document.getElementById(`img_${key}`);
                const dim = boneDimensions[key];
                if (imgEl) {
                    if (imgEl.src !== boneImages[key]) {
                        imgEl.src = boneImages[key];
                    }
                    imgEl.style.width = dim.width + 'px';
                    imgEl.style.height = dim.height + 'px';
                    
                    const config = bonesConfig[key];
                    if (config.origin === 'center center') {
                        imgEl.style.left = `-${dim.width / 2}px`;
                        imgEl.style.top = `-${dim.height / 2}px`;
                    } else if (config.origin === 'top center') {
                        imgEl.style.left = `-${dim.width / 2}px`;
                    } else if (config.origin === 'bottom center') {
                        imgEl.style.left = `-${dim.width / 2}px`;
                    }
                }
            }

            // تحديث تحويلات العظام الحركية العضوية
            const torsoDiv = document.getElementById('bone_torso');
            if (torsoDiv) {
                let extraY = Math.sin(animTime * 0.08) * 3;
                torsoDiv.style.transform = `translate(${bonesConfig.torso.x}px, ${bonesConfig.torso.y + extraY}px) rotate(${boneAngles.torso}rad)`;
                
                ['head', 'r_arm', 'l_arm', 'r_leg', 'l_leg'].forEach((bName, index) => {
                    const bDiv = document.getElementById(`bone_${bName}`);
                    const bConfig = bonesConfig[bName];
                    if (bDiv) {
                        bDiv.style.transform = `translate(${bConfig.x}px, ${bConfig.y}px) rotate(${boneAngles[bName]}rad)`;
                    }
                });
            }

            requestAnimationFrame(animationLoop);
        }

        document.getElementById('animSelect').addEventListener('change', (e) => {
            currentPose = e.target.value;
            animTime = 0;
        });

        const toggleBtn = document.getElementById('toggleBtn');
        toggleBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            toggleBtn.textContent = isPlaying ? "إيقاف مؤقت" : "تشغيل";
            toggleBtn.style.background = isPlaying ? "#4CAF50" : "#ff9800";
        });

        buildUploadSlots();
        initRigDOM();
        requestAnimationFrame(animationLoop);
    </script>
</body>
</html>
