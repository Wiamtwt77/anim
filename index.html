<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twencraft Upload Studio - نظام الهيكل الهرمي الحقيقي</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Tahoma', sans-serif;
            background: #1a1a1a;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .app-container {
            display: flex;
            gap: 20px;
            max-width: 950px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }
        .sidebar {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            width: 320px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            max-height: 520px;
            overflow-y: auto;
        }
        .stage-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .library-bar {
            background: #2a2a2a;
            padding: 12px 20px;
            border-radius: 8px;
            width: 100%;
            display: flex;
            gap: 10px;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        select, input[type="range"] {
            width: 100%;
            background: #333;
            color: #fff;
            border: 1px solid #444;
            padding: 6px;
            border-radius: 4px;
        }
        select { cursor: pointer; }
        .stage {
            width: 400px;
            height: 500px;
            background: #252525;
            border: 2px dashed #444;
            border-radius: 12px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }
        .character-rig {
            position: relative;
            width: 0;
            height: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .torso-bone {
            position: absolute;
            width: 0;
            height: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .bone-joint {
            position: absolute;
            width: 0;
            height: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .body-part {
            position: absolute;
            user-select: none;
            pointer-events: none;
        }
        .bone-control {
            margin-bottom: 12px;
            font-size: 13px;
        }
        .bone-control label {
            display: flex;
            justify-content: space-between;
            color: #4CAF50;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="sidebar">
            <div style="font-weight: bold; margin-bottom: 12px; color: #ffeb3b; font-size: 15px;">نظام العظام الهرمي (Parent-Child)</div>
            <div id="bonesControls"></div>
        </div>

        <div class="stage-container">
            <div class="library-bar">
                <label for="characterSelect" style="white-space: nowrap;">المكتبة:</label>
                <select id="characterSelect"></select>
            </div>

            <div class="stage">
                <div class="character-rig" id="characterRig"></div>
            </div>
        </div>
    </div>

    <script>
        const charactersData = [
            {
                id: "hero_mascot",
                name: "الشخصية الأساسية (الافتراضية)",
                hierarchy: {
                    torso: {
                        src: "./res/torso.png",
                        width: 74,
                        x: 0,
                        y: 0,
                        zIndex: 2,
                        origin: "center center",
                        children: [
                            {
                                id: "head",
                                src: "./res/head.png",
                                width: 88,
                                x: 0,
                                y: -110,
                                zIndex: 3,
                                origin: "bottom center"
                            },
                            {
                                id: "right_arm",
                                src: "./res/right_arm.png",
                                width: 32,
                                x: 34,
                                y: -25,
                                zIndex: 1,
                                origin: "top center"
                            },
                            {
                                id: "left_arm",
                                src: "./res/left_arm.png",
                                width: 32,
                                x: -34,
                                y: -25,
                                zIndex: 1,
                                origin: "top center"
                            },
                            {
                                id: "right_leg",
                                src: "./res/right_leg.png",
                                width: 32,
                                x: 20,
                                y: 80,
                                zIndex: 1,
                                origin: "top center"
                            },
                            {
                                id: "left_leg",
                                src: "./res/left_leg.png",
                                width: 25,
                                x: -20,
                                y: 80,
                                zIndex: 1,
                                origin: "top center"
                            }
                        ]
                    }
                }
            }
        ];

        let activeCharacterIndex = 0;
        let boneRotations = {
            torso: 0,
            head: 0,
            right_arm: 0,
            left_arm: 0,
            right_leg: 0,
            left_leg: 0
        };

        const rigContainer = document.getElementById('characterRig');
        const characterSelect = document.getElementById('characterSelect');
        const bonesControls = document.getElementById('bonesControls');

        function initLibrary() {
            characterSelect.innerHTML = '';
            charactersData.forEach((char, index) => {
                const opt = document.createElement('option');
                opt.value = index;
                opt.textContent = char.name;
                characterSelect.appendChild(opt);
            });
        }

        function renderCharacter() {
            const char = charactersData[activeCharacterIndex];
            rigContainer.innerHTML = '';

            const torsoData = char.hierarchy.torso;
            
            const torsoJoint = document.createElement('div');
            torsoJoint.className = 'torso-bone';
            torsoJoint.style.zIndex = torsoData.zIndex;
            torsoJoint.style.transform = `translate(${torsoData.x}px, ${torsoData.y}px) rotate(${boneRotations.torso}deg)`;

            const torsoImg = document.createElement('img');
            torsoImg.src = torsoData.src;
            torsoImg.className = 'body-part';
            torsoImg.style.width = torsoData.width + 'px';
            torsoImg.style.transformOrigin = torsoData.origin;
            torsoImg.style.transform = `translate(-50%, -50%)`;
            torsoJoint.appendChild(torsoImg);

            torsoData.children.forEach(child => {
                const childJoint = document.createElement('div');
                childJoint.className = 'bone-joint';
                childJoint.style.zIndex = child.zIndex;
                childJoint.style.transform = `translate(${child.x}px, ${child.y}px)`;

                const childImg = document.createElement('img');
                childImg.src = child.src;
                childImg.className = 'body-part';
                childImg.style.width = child.width + 'px';
                childImg.style.transformOrigin = child.origin;
                
                const rot = boneRotations[child.id] || 0;
                childImg.style.transform = `rotate(${rot}deg)`;

                childJoint.appendChild(childImg);
                torsoJoint.appendChild(childJoint);
            });

            rigContainer.appendChild(torsoJoint);
        }

        function buildBoneControls() {
            bonesControls.innerHTML = '';
            const partsList = ['torso', 'head', 'right_arm', 'left_arm', 'right_leg', 'left_leg'];

            partsList.forEach(partName => {
                const currentRot = boneRotations[partName] || 0;
                const div = document.createElement('div');
                div.className = 'bone-control';
                div.innerHTML = `
                    <label><span>عظمة: ${partName}</span><span id="val_${partName}">${currentRot}°</span></label>
                    <input type="range" min="-90" max="90" value="${currentRot}" data-part="${partName}">
                `;
                bonesControls.appendChild(div);
            });

            bonesControls.querySelectorAll('input[type="range"]').forEach(slider => {
                slider.addEventListener('input', (e) => {
                    const part = e.target.dataset.part;
                    const val = parseInt(e.target.value);
                    boneRotations[part] = val;
                    document.getElementById(`val_${part}`).textContent = val + '°';
                    renderCharacter();
                });
            });
        }

        characterSelect.addEventListener('change', (e) => {
            activeCharacterIndex = parseInt(e.target.value);
            Object.keys(boneRotations).forEach(k => boneRotations[k] = 0);
            buildBoneControls();
            renderCharacter();
        });

        initLibrary();
        buildBoneControls();
        renderCharacter();
    </script>
</body>
</html>
