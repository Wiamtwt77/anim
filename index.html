<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twencraft Upload Studio - معايرة إحداثيات المجسم</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Tahoma', sans-serif;
            background: #1a1a1a;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .app-container {
            display: flex;
            gap: 20px;
            max-width: 1050px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }
        .sidebar {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            width: 360px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            max-height: 600px;
            overflow-y: auto;
        }
        .stage-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .library-bar {
            background: #2a2a2a;
            padding: 12px 20px;
            border-radius: 8px;
            width: 100%;
            display: flex;
            gap: 10px;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        select, input[type="number"] {
            background: #333;
            color: #fff;
            border: 1px solid #444;
            padding: 4px 8px;
            border-radius: 4px;
        }
        input[type="number"] { width: 65px; text-align: center; }
        select { width: 100%; cursor: pointer; }
        .stage {
            width: 400px;
            height: 500px;
            background: #252525;
            border: 2px dashed #444;
            border-radius: 12px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }
        .character-rig {
            position: relative;
            width: 0;
            height: 0;
        }
        .bone-node {
            position: absolute;
            width: 0;
            height: 0;
        }
        .body-part {
            position: absolute;
            user-select: none;
            pointer-events: none;
        }
        .bone-control {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #444;
            font-size: 12px;
        }
        .bone-control label {
            display: block;
            color: #ffeb3b;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .control-row {
            display: flex;
            gap: 8px;
            margin-top: 4px;
            align-items: center;
            justify-content: space-between;
        }
        .export-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        .export-btn:hover { background: #45a049; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- لوحة التحكم الحية بالأرقام -->
        <div class="sidebar">
            <div style="font-weight: bold; margin-bottom: 10px; color: #4CAF50; font-size: 14px;">لوحة معايرة المقاييس الدقيقة</div>
            <div id="bonesControls"></div>
            <button class="export-btn" onclick="exportConfig()">استخراج المقاييس الحالية (Console)</button>
        </div>

        <div class="stage-container">
            <div class="library-bar">
                <label for="characterSelect" style="white-space: nowrap;">المكتبة:</label>
                <select id="characterSelect"></select>
            </div>

            <div class="stage">
                <div class="character-rig" id="characterRig"></div>
            </div>
        </div>
    </div>

    <script>
        const charactersData = [
            {
                id: "hero_mascot",
                name: "الشخصية الأساسية (معايرة صحيحة)",
                rootBone: "torso",
                bones: {
                    torso: {
                        src: "./res/torso.png",
                        width: 74,
                        x: 0, y: 0,
                        zIndex: 2,
                        origin: "center center",
                        children: ["head", "right_arm", "left_arm", "right_leg", "left_leg"]
                    },
                    head: {
                        src: "./res/head.png",
                        width: 88,
                        x: 0, y: -55, // تعديل القيمة لتلصق الرأس فوق الجذع مباشرة
                        zIndex: 3,
                        origin: "bottom center",
                        children: []
                    },
                    right_arm: {
                        src: "./res/right_arm.png",
                        width: 32,
                        x: 30, y: -11,
                        zIndex: 1,
                        origin: "top center",
                        children: []
                    },
                    left_arm: {
                        src: "./res/left_arm.png",
                        width: 32,
                        x: -33, y: -11,
                        zIndex: 1,
                        origin: "top center",
                        children: []
                    },
                    right_leg: {
                        src: "./res/right_leg.png",
                        width: 32,
                        x: 18, y: 40, // تقريب الأرجل لأعلى لتتصل بقاعدة الجذع
                        zIndex: 1,
                        origin: "top center",
                        children: []
                    },
                    left_leg: {
                        src: "./res/left_leg.png",
                        width: 25,
                        x: -15, y: 40, // تقريب الأرجل لأعلى لتتصل بقاعدة الجذع
                        zIndex: 1,
                        origin: "top center",
                        children: []
                    }
                }
            }
        ];

        let activeCharacterIndex = 0;
        let boneRotations = { head: 0, right_arm: 0, left_arm: 0, right_leg: 0, left_leg: 0, torso: 0 };

        const rigContainer = document.getElementById('characterRig');
        const characterSelect = document.getElementById('characterSelect');
        const bonesControls = document.getElementById('bonesControls');

        function initLibrary() {
            characterSelect.innerHTML = '';
            charactersData.forEach((char, index) => {
                const opt = document.createElement('option');
                opt.value = index;
                opt.textContent = char.name;
                characterSelect.appendChild(opt);
            });
        }

        function createBoneElement(boneName, bonesDict) {
            const bone = bonesDict[boneName];
            
            const nodeDiv = document.createElement('div');
            nodeDiv.className = 'bone-node';
            nodeDiv.style.zIndex = bone.zIndex;
            nodeDiv.style.transform = `translate(${bone.x}px, ${bone.y}px)`;

            const img = document.createElement('img');
            img.src = bone.src;
            img.className = 'body-part';
            img.style.width = bone.width + 'px';
            img.style.transformOrigin = bone.origin;
            
            const rot = boneRotations[boneName] || 0;

            if (bone.origin === 'top center') {
                img.style.left = '50%';
                img.style.top = '0';
                img.style.transform = `translateX(-50%) rotate(${rot}deg)`;
            } else if (bone.origin === 'bottom center') {
                img.style.left = '50%';
                img.style.bottom = '0';
                img.style.transform = `translateX(-50%) rotate(${rot}deg)`;
            } else {
                img.style.left = '50%';
                img.style.top = '50%';
                img.style.transform = `translate(-50%, -50%) rotate(${rot}deg)`;
            }
            
            nodeDiv.appendChild(img);

            if (bone.children && bone.children.length > 0) {
                bone.children.forEach(childName => {
                    nodeDiv.appendChild(createBoneElement(childName, bonesDict));
                });
            }

            return nodeDiv;
        }

        function renderCharacter() {
            const char = charactersData[activeCharacterIndex];
            rigContainer.innerHTML = '';
            rigContainer.appendChild(createBoneElement(char.rootBone, char.bones));
        }

        function buildBoneControls() {
            bonesControls.innerHTML = '';
            const char = charactersData[activeCharacterIndex];

            for (const [partName, bone] of Object.entries(char.bones)) {
                const currentRot = boneRotations[partName] || 0;
                const div = document.createElement('div');
                div.className = 'bone-control';
                div.innerHTML = `
                    <label>عظمة: ${partName}</label>
                    <div class="control-row">
                        <span>موقع X: <input type="number" value="${bone.x}" data-part="${partName}" data-prop="x"></span>
                        <span>موقع Y: <input type="number" value="${bone.y}" data-part="${partName}" data-prop="y"></span>
                    </div>
                    <div class="control-row" style="margin-top: 6px;">
                        <span>العرض: <input type="number" value="${bone.width}" data-part="${partName}" data-prop="width"></span>
                        <span>دوران (°): <input type="number" value="${currentRot}" data-part="${partName}" data-prop="rot" min="-90" max="90"></span>
                    </div>
                `;
                bonesControls.appendChild(div);
            }

            bonesControls.querySelectorAll('input').forEach(input => {
                input.addEventListener('input', (e) => {
                    const part = e.target.dataset.part;
                    const prop = e.target.dataset.prop;
                    const val = parseFloat(e.target.value) || 0;

                    if (prop === 'rot') {
                        boneRotations[part] = val;
                    } else {
                        charactersData[activeCharacterIndex].bones[part][prop] = val;
                    }
                    renderCharacter();
                });
            });
        }

        function exportConfig() {
            const char = charactersData[activeCharacterIndex];
            console.log(JSON.stringify(char.bones, null, 4));
            alert("تم طباعة المقاييس الحالية في وحدة التحكم (Console) F12!");
        }

        characterSelect.addEventListener('change', (e) => {
            activeCharacterIndex = parseInt(e.target.value);
            buildBoneControls();
            renderCharacter();
        });

        initLibrary();
        buildBoneControls();
        renderCharacter();
    </script>

</body>
</html>
