<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استوديو تحريك الشخصيات - المعايرة الحية</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Tahoma', sans-serif;
            background: #1a1a1a;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 { margin-bottom: 10px; font-size: 20px; color: #4CAF50; }
        
        .container {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .stage {
            width: 350px;
            height: 450px;
            background: #252525;
            border: 2px dashed #444;
            border-radius: 12px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        .character-rig {
            position: relative;
            width: 0;
            height: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .body-part {
            position: absolute;
            transform-origin: top center;
            user-select: none;
            pointer-events: none;
        }

        /* لوحة التحكم الجانبية لتعديل الإحداثيات مباشرة */
        .controls-panel {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            width: 320px;
            max-height: 450px;
            overflow-y: auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .part-control {
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid #444;
        }
        .part-control label {
            display: block;
            font-size: 13px;
            color: #4CAF50;
            margin-bottom: 4px;
        }
        .inputs-row {
            display: flex;
            gap: 8px;
            font-size: 12px;
        }
        .inputs-row div { flex: 1; }
        .inputs-row input {
            width: 100%;
            background: #333;
            border: 1px solid #555;
            color: #fff;
            padding: 4px;
            border-radius: 4px;
            text-align: center;
        }
        .output-box {
            margin-top: 15px;
            background: #111;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 11px;
            color: #00ffcc;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <h1>استوديو المعايرة الحية لأجزاء الشخصية</h1>
    
    <div class="container">
        <!-- مساحة العرض -->
        <div class="stage">
            <div class="character-rig" id="characterRig"></div>
        </div>

        <!-- لوحة التحكم الحية -->
        <div class="controls-panel" id="controlsPanel">
            <div style="font-weight: bold; margin-bottom: 10px; color: #ffeb3b;">عُمّر أو عدّل القيم هنا:</div>
            <div id="slidersContainer"></div>
            <div class="output-box" id="outputJson"></div>
        </div>
    </div>

    <script>
        // هيكل البيانات القابل للتعديل الفوري
        let currentCharacter = {
            id: "hero_mascot",
            name: "الشخصية الأساسية",
            parts: {
                torso:      { src: "./res/torso.png",      width: 90,  x: 0,   y: -30,  zIndex: 2 },
                head:       { src: "./res/head.png",       width: 100, x: 0,   y: -140, zIndex: 3 },
                right_arm:  { src: "./res/right_arm.png",  width: 32,  x: -45, y: -40,  zIndex: 1 },
                left_arm:   { src: "./res/left_arm.png",   width: 32,  x: 45,  y: -40,  zIndex: 1 },
                right_leg:  { src: "./res/right_leg.png",  width: 35,  x: -20, y: 50,   zIndex: 1 },
                left_leg:   { src: "./res/left_leg.png",   width: 35,  x: 20,  y: 50,   zIndex: 1 }
            }
        };

        const rigContainer = document.getElementById('characterRig');
        const slidersContainer = document.getElementById('slidersContainer');
        const outputJson = document.getElementById('outputJson');

        function render() {
            rigContainer.innerHTML = '';
            for (const [partName, info] of Object.entries(currentCharacter.parts)) {
                // رسم الصورة
                const img = document.createElement('img');
                img.src = info.src;
                img.className = 'body-part';
                img.style.width = info.width + 'px';
                img.style.zIndex = info.zIndex;
                img.style.transform = `translate(${info.x}px, ${info.y}px)`;
                rigContainer.appendChild(img);
            }
            outputJson.textContent = JSON.stringify(currentCharacter.parts, null, 2);
        }

        function buildControls() {
            slidersContainer.innerHTML = '';
            for (const [partName, info] of Object.entries(currentCharacter.parts)) {
                const div = document.createElement('div');
                div.className = 'part-control';
                div.innerHTML = `
                    <label>${partName}</label>
                    <div class="inputs-row">
                        <div>عرض: <input type="number" value="${info.width}" data-part="${partName}" data-prop="width"></div>
                        <div>X: <input type="number" value="${info.x}" data-part="${partName}" data-prop="x"></div>
                        <div>Y: <input type="number" value="${info.y}" data-part="${partName}" data-prop="y"></div>
                    </div>
                `;
                slidersContainer.appendChild(div);
            }

            // الاستماع لتغييرات المدخلات بشكل فوري
            slidersContainer.querySelectorAll('input').forEach(input => {
                input.addEventListener('input', (e) => {
                    const part = e.target.dataset.part;
                    const prop = e.target.dataset.prop;
                    currentCharacter.parts[part][prop] = parseFloat(e.target.value) || 0;
                    render();
                });
            });
        }

        buildControls();
        render();
    </script>

</body>
</html>
