<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استوديو تحريك الشخصيات</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Tahoma', sans-serif;
            background: #1a1a1a;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 { margin-bottom: 10px; font-size: 22px; color: #4CAF50; }
        
        .library-bar {
            background: #2a2a2a;
            padding: 15px 25px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            gap: 10px;
            align-items: center;
        }
        select {
            padding: 8px 15px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #333;
            color: #fff;
            cursor: pointer;
        }

        .stage {
            width: 400px;
            height: 500px;
            background: #252525;
            border: 2px dashed #444;
            border-radius: 12px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        .character-rig {
            position: relative;
            width: 0;
            height: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .body-part {
            position: absolute;
            transform-origin: top center; /* نقطة الارتكاز من الأعلى لتبدو الأذرع والأرجل طبيعية */
            user-select: none;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <h1>مكتبة الشخصيات الجاهزة</h1>
    
    <div class="library-bar">
        <label for="characterSelect">اختر شخصية:</label>
        <select id="characterSelect">
            <option value="0">الشخصية الأساسية (الافتراضية)</option>
        </select>
    </div>

    <div class="stage">
        <div class="character-rig" id="characterRig"></div>
    </div>

    <script>
        // تعريف الشخصيات مع تحديد عرض دقيق (width) لكل جزء ليتناسب مع البقية
        const charactersData = [
            {
                id: "hero_mascot",
                name: "الشخصية الأساسية (الافتراضية)",
                parts: {
                    torso:      { src: "./res/torso.png",      width: 90,  x: -45,  y: -50,  zIndex: 2 },
                    head:       { src: "./res/head.png",       width: 110, x: -55,  y: -155, zIndex: 3 },
                    right_arm:  { src: "./res/right_arm.png",  width: 35,  x: -80,  y: -40,  zIndex: 1 },
                    left_arm:   { src: "./res/left_arm.png",   width: 35,  x: 45,   y: -40,  zIndex: 1 },
                    right_leg:  { src: "./res/right_leg.png",  width: 38,  x: -42,  y: 45,   zIndex: 1 },
                    left_leg:   { src: "./res/left_leg.png",   width: 38,  x: 4,    y: 45,   zIndex: 1 }
                }
            }
        ];

        function renderCharacter(character) {
            const rigContainer = document.getElementById('characterRig');
            rigContainer.innerHTML = ''; 

            for (const [partName, partInfo] of Object.entries(character.parts)) {
                const img = document.createElement('img');
                img.src = partInfo.src;
                img.className = 'body-part';
                img.style.width = partInfo.width + 'px'; // تطبيق التحجيم الإجباري
                img.style.zIndex = partInfo.zIndex || 1;
                img.style.transform = `translate(${partInfo.x}px, ${partInfo.y}px)`;
                rigContainer.appendChild(img);
            }
        }

        renderCharacter(charactersData[0]);
    </script>

</body>
</html>
