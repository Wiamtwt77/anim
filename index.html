<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twencraft Upload & Animation Studio - نظام الهيكل العظمي المخصص</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Tahoma', sans-serif;
            background: #141414;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .app-container {
            display: flex;
            gap: 20px;
            max-width: 1150px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }
        .sidebar {
            background: #1f1f1f;
            padding: 15px;
            border-radius: 10px;
            width: 380px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            max-height: 650px;
            overflow-y: auto;
            border: 1px solid #333;
        }
        .stage-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .top-bar {
            background: #1f1f1f;
            padding: 12px 20px;
            border-radius: 10px;
            width: 100%;
            display: flex;
            gap: 15px;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            border: 1px solid #333;
        }
        .control-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-size: 12px;
            color: #ffeb3b;
        }
        select, button, input[type="file"] {
            width: 100%;
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }
        button {
            background: #4CAF50;
            font-weight: bold;
            border: none;
            transition: background 0.2s;
        }
        button:hover { background: #45a049; }
        .stage {
            width: 440px;
            height: 540px;
            background: #1a1a1a;
            border: 2px dashed #444;
            border-radius: 12px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
        }
        .upload-slot {
            background: #252525;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            border: 1px solid #333;
        }
        .upload-slot label {
            display: block;
            font-weight: bold;
            color: #4CAF50;
            margin-bottom: 4px;
            font-size: 13px;
        }
        .upload-slot span {
            display: block;
            font-size: 11px;
            color: #aaa;
            margin-bottom: 6px;
        }
        /* الهيكل العظمي والمجسمات المرتبطة */
        .character-rig {
            position: relative;
            width: 0;
            height: 0;
        }
        .bone-node {
            position: absolute;
            width: 0;
            height: 0;
        }
        .body-part-img {
            position: absolute;
            user-select: none;
            pointer-events: none;
            transform-origin: top center;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- لوحة رفع الصور وإدارة الأبعاد -->
        <div class="sidebar">
            <div style="font-weight: bold; margin-bottom: 10px; color: #ffeb3b; font-size: 15px;">استوديو رفع وتخصيص العظام</div>
            <div style="font-size: 12px; color: #ccc; margin-bottom: 15px; line-height: 1.5;">
                قم برفع صور أجزاء الشخصية بالشفافية (PNG). الحبيبات تتكيف تلقائياً مع محرك العظام العضوي المرن.
            </div>

            <div id="uploadSlotsContainer"></div>
        </div>

        <div class="stage-container">
            <div class="top-bar">
                <div class="control-group">
                    <label for="animSelect">مكتبة التحركات العضوية السلسة:</label>
                    <select id="animSelect">
                        <option value="idle">تنفس واستعداد هادئ (Organic Idle)</option>
                        <option value="walk">مشية احترافية مرنة (Fluid Walk)</option>
                        <option value="dance">رقصة حماسية متأرجحة (Dynamic Dance)</option>
                    </select>
                </div>
                <div style="width: 110px;">
                    <label style="opacity: 0;">تشغيل</label>
                    <button id="toggleBtn">إيقاف مؤقت</button>
                </div>
            </div>

            <div class="stage">
                <div class="character-rig" id="characterRig"></div>
            </div>
        </div>
    </div>

    <script>
        // تعريف بيانات المفاصل والعظام مع الأبعاد المقترحة وخصائص الربط
        const bonesConfig = {
            torso: {
                name: "الجذع الأساسي (Torso)",
                suggestedSize: "عرض 90px × ارتفاع 130px",
                width: 90, height: 130,
                x: 0, y: -20,
                origin: "center center",
                zIndex: 2,
                defaultImg: generatePlaceholderDataURL('الجذع', '#4CAF50', 90, 130),
                children: ['head', 'r_arm', 'l_arm', 'r_leg', 'l_leg']
            },
            head: {
                name: "الرأس (Head)",
                suggestedSize: "عرض 90px × ارتفاع 90px",
                width: 90, height: 90,
                x: 0, y: -75,
                origin: "bottom center",
                zIndex: 3,
                defaultImg: generatePlaceholderDataURL('الرأس', '#ffccbc', 90, 90),
                children: []
            },
            r_arm: {
                name: "الذراع اليمنى (Right Arm)",
                suggestedSize: "عرض 35px × ارتفاع 100px",
                width: 35, height: 100,
                x: 35, y: -50,
                origin: "top center",
                zIndex: 2,
                defaultImg: generatePlaceholderDataURL('ذراع يمنى', '#66bb6a', 35, 100),
                children: []
            },
            l_arm: {
                name: "الذراع اليسرى (Left Arm)",
                suggestedSize: "عرض 35px × ارتفاع 100px",
                width: 35, height: 100,
                x: -35, y: -50,
                origin: "top center",
                zIndex: 2,
                defaultImg: generatePlaceholderDataURL('ذراع يسرى', '#66bb6a', 35, 100),
                children: []
            },
            r_leg: {
                name: "الرجل اليمنى (Right Leg)",
                suggestedSize: "عرض 40px × ارتفاع 110px",
                width: 40, height: 110,
                x: 20, y: 60,
                origin: "top center",
                zIndex: 1,
                defaultImg: generatePlaceholderDataURL('رجل يمنى', '#388e3c', 40, 110),
                children: []
            },
            l_leg: {
                name: "الرجل اليسرى (Left Leg)",
                suggestedSize: "عرض 40px × ارتفاع 110px",
                width: 40, height: 110,
                x: -20, y: 60,
                origin: "top center",
                zIndex: 1,
                defaultImg: generatePlaceholderDataURL('رجل يسرى', '#388e3c', 40, 110),
                children: []
            }
        };

        // تخزين روابط الصور الحالية (مبدئياً الأشكال الافتراضية)
        let boneImages = {};
        for (let key in bonesConfig) {
            boneImages[key] = bonesConfig[key].defaultImg;
        }

        // إعدادات زوايا العظام الحالية والمستهدفة للتحريك غير الخطي (Spring Physics / Lag)
        let boneAngles = {
            torso: 0, head: 0, r_arm: 0, l_arm: 0, r_leg: 0, l_leg: 0
        };
        let boneTargetAngles = {
            torso: 0, head: 0, r_arm: 0, l_arm: 0, r_leg: 0, l_leg: 0
        };
        let boneLags = {
            torso: 0.12, head: 0.15, r_arm: 0.09, l_arm: 0.09, r_leg: 0.1, l_leg: 0.1
        };

        let animTime = 0;
        let isPlaying = true;
        let currentPose = 'idle';

        // دالة مساعدة لإنشاء صور مؤقتة ملونة واضحة في حال لم يرفع المستخدم صورة بعد
        function generatePlaceholderDataURL(text, color, w, h) {
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = color;
            ctx.roundRect ? ctx.roundRect(0, 0, w, h, 10) : ctx.fillRect(0, 0, w, h);
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.fillStyle = '#111';
            ctx.font = 'bold 11px Tahoma';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, w / 2, h / 2);
            return canvas.toDataURL();
        }

        // بناء حقول الرفع في القائمة الجانبية
        function buildUploadSlots() {
            const container = document.getElementById('uploadSlotsContainer');
            container.innerHTML = '';

            for (let [key, config] of Object.entries(bonesConfig)) {
                const slot = document.createElement('div');
                slot.className = 'upload-slot';
                slot.innerHTML = `
                    <label>${config.name}</label>
                    <span>الأبعاد المقترحة: <b>${config.suggestedSize}</b></span>
                    <input type="file" accept="image/png, image/jpeg" data-bone="${key}">
                `;
                container.appendChild(slot);
            }

            container.querySelectorAll('input[type="file"]').forEach(input => {
                input.addEventListener('change', (e) => {
                    const boneKey = e.target.dataset.bone;
                    const file = e.target.files[0];
                    if (file) {
                        const url = URL.createObjectURL(file);
                        boneImages[boneKey] = url;
                        renderRig();
                    }
                });
            });
        }

        // مكتبة الحركات العضوية (تغذية الزوايا المستهدفة)
        const poses = {
            idle: (t) => {
                boneTargetAngles.torso = Math.sin(t * 0.04) * 0.03;
                boneTargetAngles.head = Math.sin(t * 0.04) * 0.08;
                boneTargetAngles.r_arm = 0.1 + Math.sin(t * 0.04) * 0.1;
                boneTargetAngles.l_arm = -0.1 - Math.sin(t * 0.04) * 0.1;
                boneTargetAngles.r_leg = 0.05;
                boneTargetAngles.l_leg = -0.05;
            },
            walk: (t) => {
                boneTargetAngles.torso = Math.sin(t * 0.08) * 0.05;
                boneTargetAngles.head = Math.sin(t * 0.08) * 0.06;
                boneTargetAngles.r_arm = Math.sin(t * 0.08) * 0.6;
                boneTargetAngles.l_arm = -Math.sin(t * 0.08) * 0.6;
                boneTargetAngles.r_leg = -Math.sin(t * 0.08) * 0.5;
                boneTargetAngles.l_leg = Math.sin(t * 0.08) * 0.5;
            },
            dance: (t) => {
                boneTargetAngles.torso = Math.sin(t * 0.15) * 0.15;
                boneTargetAngles.head = Math.cos(t * 0.15) * 0.2;
                boneTargetAngles.r_arm = -1.5 + Math.sin(t * 0.15) * 0.8;
                boneTargetAngles.l_arm = 1.5 + Math.cos(t * 0.15) * 0.8;
                boneTargetAngles.r_leg = Math.sin(t * 0.15) * 0.4;
                boneTargetAngles.l_leg = -Math.sin(t * 0.15) * 0.4;
            }
        };

        // محرك القصور الذاتي والنعومة (Lag & Physics Interpolation)
        function updatePhysics() {
            if (isPlaying) {
                animTime += 1;
                if (poses[currentPose]) {
                    poses[currentPose](animTime);
                }
            }

            // تطبيق استيفاء غير خطي يعتمد على القصور الذاتي لتجنب الجمود تماماً
            for (let key in boneAngles) {
                let diff = boneTargetAngles[key] - boneAngles[key];
                boneAngles[key] += diff * (boneLags[key] || 0.1);
            }
        }

        // بناء عناصر الهيكل العظمي والمجسمات في DOM
        const rigContainer = document.getElementById('characterRig');

        function createBoneNodeDOM(boneName) {
            const config = bonesConfig[boneName];
            const angle = boneAngles[boneName] || 0;

            const node = document.createElement('div');
            node.className = 'bone-node';
            node.style.zIndex = config.zIndex;
            node.style.transform = `translate(${config.x}px, ${config.y}px) rotate(${angle}rad)`;
            node.style.transformOrigin = config.origin;

            // إنشاء عنصر الصورة المكيّف مع أبعاد العظمة
            const img = document.createElement('img');
            img.src = boneImages[boneName];
            img.className = 'body-part-img';
            img.style.width = config.width + 'px';
            img.style.height = config.height + 'px';
            
            // ضبط نقطة الارتكاز المركزية للصورة بناءً على إعدادات العظمة
            if (config.origin === 'top center') {
                img.style.left = `-${config.width / 2}px`;
                img.style.top = '0px';
            } else if (config.origin === 'bottom center') {
                img.style.left = `-${config.width / 2}px`;
                img.style.bottom = '0px';
            } else {
                img.style.left = `-${config.width / 2}px`;
                img.style.top = `-${config.height / 2}px`;
            }

            node.appendChild(img);

            // تكرار الأبناء إن وجدوا (مثل الأطراف والرأس داخل الجذع)
            if (config.children && config.children.length > 0) {
                config.children.forEach(childName => {
                    node.appendChild(createBoneNodeDOM(childName));
                });
            }

            return node;
        }

        function renderRig() {
            rigContainer.innerHTML = '';
            // الجذر هو الجذع (Torso)
            const rootNode = createBoneNodeDOM('torso');
            rigContainer.appendChild(rootNode);
        }

        // حلقة التحديث المستمرة للرسوم المتحركة
        function animationLoop() {
            updatePhysics();
            
            // تحديث التحويلات الهندسية للعظام مباشرة في DOM لأداء سلس للغاية
            const torsoNode = rigContainer.firstElementChild;
            if (torsoNode) {
                // تحديث الجذع وتوابعه بالمواقع والزوايا الجديدة المحسوبة بالفيزياء العضوية
                updateNodeTransformRecursive(rigContainer.firstElementChild, 'torso');
            }

            requestAnimationFrame(animationLoop);
        }

        function updateNodeTransformRecursive(element, boneName) {
            if (!element) return;
            const config = bonesConfig[boneName];
            const angle = boneAngles[boneName] || 0;

            // تطبيق الحركة مع إزاحة طفيفة في موضع الجذع لإعطاء شعور بالاستعداد والطفو الحيوي
            let extraX = 0, extraY = 0;
            if (boneName === 'torso') {
                extraY = Math.sin(animTime * 0.08) * 3;
            }

            element.style.transform = `translate(${config.x + extraX}px, ${config.y + extraY}px) rotate(${angle}rad)`;

            let childIndex = 1; // العنصر 0 هو الـ img
            if (config.children && config.children.length > 0) {
                config.children.forEach(childName => {
                    const childElement = element.children[childIndex];
                    if (childElement) {
                        updateNodeTransformRecursive(childElement, childName);
                    }
                    childIndex++;
                });
            }
        }

        // ربط الأحداث والتحكم
        document.getElementById('animSelect').addEventListener('change', (e) => {
            currentPose = e.target.value;
            animTime = 0;
        });

        const toggleBtn = document.getElementById('toggleBtn');
        toggleBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            toggleBtn.textContent = isPlaying ? "إيقاف مؤقت" : "تشغيل";
            toggleBtn.style.background = isPlaying ? "#4CAF50" : "#ff9800";
        });

        // التشغيل الأولي
        buildUploadSlots();
        
        // بناء الهيكل الأولي مرة واحدة في الـ DOM ثم تحديثه عبر الإطارات لسرعة فائقة
        function initRigDOM() {
            rigContainer.innerHTML = '';
            const torsoDiv = document.createElement('div');
            torsoDiv.className = 'bone-node';
            torsoDiv.id = 'bone_torso';
            torsoDiv.style.zIndex = bonesConfig.torso.zIndex;
            
            const torsoImg = document.createElement('img');
            torsoImg.src = boneImages.torso;
            torsoImg.className = 'body-part-img';
            torsoImg.style.width = bonesConfig.torso.width + 'px';
            torsoImg.style.height = bonesConfig.torso.height + 'px';
            torsoImg.style.left = `-${bonesConfig.torso.width / 2}px`;
            torsoImg.style.top = `-${bonesConfig.torso.height / 2}px`;
            torsoDiv.appendChild(torsoImg);

            // إضافة الأطراف كعناصر ابنة داخل الجذع لتتبع الهيكل العظمي بدقة
            ['head', 'r_arm', 'l_arm', 'r_leg', 'l_leg'].forEach(bName => {
                const bConfig = bonesConfig[bName];
                const bDiv = document.createElement('div');
                bDiv.className = 'bone-node';
                bDiv.id = `bone_${bName}`;
                bDiv.style.zIndex = bConfig.zIndex;
                bDiv.style.transformOrigin = bConfig.origin;
                
                const bImg = document.createElement('img');
                bImg.src = boneImages[bName];
                bImg.className = 'body-part-img';
                bImg.style.width = bConfig.width + 'px';
                bImg.style.height = bConfig.height + 'px';
                
                if (bConfig.origin === 'top center') {
                    bImg.style.left = `-${bConfig.width / 2}px`;
                    bImg.style.top = '0px';
                } else if (bConfig.origin === 'bottom center') {
                    bImg.style.left = `-${bConfig.width / 2}px`;
                    bImg.style.bottom = '0px';
                }
                bDiv.appendChild(bImg);
                torsoDiv.appendChild(bDiv);
            });

            rigContainer.appendChild(torsoDiv);
        }

        // تحديث الصور ديناميكياً عند رفع صور جديدة
        const originalRenderRig = renderRig;
        renderRig = function() {
            initRigDOM();
        };

        initRigDOM();
        requestAnimationFrame(animationLoop);
    </script>
</body>
</html>
